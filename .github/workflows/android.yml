name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'tools/reproducible/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'tools/reproducible/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# The job only reads the repository; third-party actions get no wider token.
# Every action is pinned to a commit, not a tag: a tag can be moved to code
# that was never reviewed, a commit cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships Android SDK (API 35, build-tools 35.x) and sets
      # ANDROID_HOME; the pinned NDK is installed below.

      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # The same version comms-crypto/rust-toolchain.toml names, so the
          # crate is built with one compiler everywhere; bump both together.
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      # The committed wrapper jar is checked against Gradle's published
      # checksums before anything runs it, and the build goes through the
      # wrapper, so the Gradle version and the distribution's checksum come
      # from android/gradle/wrapper/gradle-wrapper.properties here and on a
      # developer's machine alike.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      - name: Build debug APK
        working-directory: android
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew assembleDebug --no-daemon --stacktrace

      # The Kotlin unit tests: detectors, routing, comms wire formats, the tour's
      # coverage. They used to be run by nobody; a build that compiles is not one
      # whose detectors work.
      - name: Kotlin unit tests
        working-directory: android
        run: |
          ./gradlew testFullSuiteDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      # Every debug variant: the full edition's whole app (app-full-suite-debug.apk)
      # and comms-only build (app-full-comms-debug.apk), and the Play edition
      # (app-play-suite-debug.apk).
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clairix-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  # Two builds of one commit on two machines must come out the same, or a
  # published APK can never be checked against the source. Each copy builds
  # the full edition with no keystore in the environment, and compare-builds
  # requires the two to agree: the release APK, which Gradle writes unsigned
  # without a keystore, byte for byte, and the debug APK entry for entry
  # (each machine signs it with a debug key it makes for itself). No Rust
  # cache here: a restored target directory would hide a difference, not
  # show it.
  reproducible-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [first, second]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The debug APK always; the release APK, unsigned, once the asset signing
      # public key is committed. A release build refuses to run without it (see
      # android/app/build.gradle.kts), so the check grows to cover releases the
      # moment releases become possible.
      - name: Build the full edition
        working-directory: android
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          TASKS="assembleFullSuiteDebug"
          if [ -f asset-signing.pub ]; then
            TASKS="$TASKS assembleFullSuiteRelease"
          else
            echo "::notice::android/asset-signing.pub is not committed yet, so no release build is possible; the debug build alone is compared"
          fi
          ./gradlew $TASKS --no-daemon --stacktrace
          OUT=app/build/outputs/reproducible
          mkdir -p "$OUT"
          cp app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk "$OUT/"
          if [ -f asset-signing.pub ]; then
            cp app/build/outputs/apk/fullSuite/release/app-full-suite-release-unsigned.apk "$OUT/"
          fi
          sha256sum "$OUT"/*.apk

      # The library must carry no path from this machine, or a build from any
      # other directory differs for no reason (see cargoNdkBuild in
      # android/app/build.gradle.kts). The unstripped libraries are checked:
      # their debug info is where such a path would survive.
      - name: Check the crypto library for build-machine paths
        run: |
          shopt -s nullglob
          found=0; checked=0
          for so in android/app/build/rust/jniLibs/*/libclairix_comms_crypto.so; do
            checked=$((checked + 1))
            if strings "$so" | grep -E -m 5 "$GITHUB_WORKSPACE|/home/runner|\.cargo/registry"; then
              echo "::error file=$so::carries a path from the build machine"; found=1
            fi
          done
          if [ "$checked" = 0 ]; then
            echo "::error::No library found under android/app/build/rust/jniLibs; the check proved nothing"; exit 1
          fi
          if [ "$found" = 0 ]; then echo "No build-machine path in $checked libraries."; fi
          exit $found

      - name: Upload the APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducible-${{ matrix.copy }}
          path: android/app/build/outputs/reproducible/*.apk
          if-no-files-found: error

  compare-builds:
    needs: reproducible-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reproducible-*
          path: builds

      - name: Require the two builds to agree
        run: tools/reproducible/compare-builds.sh builds/reproducible-first builds/reproducible-second
