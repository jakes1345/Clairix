name: Android APK

on:
  push:
    # Branches only. A tag, or a release/v* branch, starts the Release
    # workflow, which runs this one (workflow_call below) before it signs
    # anything; a push of either would otherwise build the same commit twice.
    branches:
      - '**'
      - '!release/v*'
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'relays/**'
      - 'tools/android/**'
      - 'tools/reproducible/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'relays/**'
      - 'tools/android/**'
      - 'tools/reproducible/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: 'Record the screenshot goldens on this runner instead of comparing them, and keep them as the recorded-screenshots artifact to commit under android/app/src/test/snapshots/images'
        type: boolean
        required: false
        default: false
  # Called by release.yml: a release is signed only after every job here has
  # passed on the commit being released. Path filters do not apply to a call.
  workflow_call:

# The job only reads the repository; third-party actions get no wider token.
# Every action is pinned to a commit, not a tag: a tag can be moved to code
# that was never reviewed, a commit cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (build-tools 35.x) and sets
      # ANDROID_HOME; the pinned NDK and the API 36 platform the app compiles
      # against are installed below.

      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # The same version comms-crypto/rust-toolchain.toml names, so the
          # crate is built with one compiler everywhere; bump both together.
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK, the API 36 platform and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      # The committed wrapper jar is checked against Gradle's published
      # checksums before anything runs it, and the build goes through the
      # wrapper, so the Gradle version and the distribution's checksum come
      # from android/gradle/wrapper/gradle-wrapper.properties here and on a
      # developer's machine alike.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      # The Tor transport (src/tor.rs) end to end: bootstraps over the real
      # Tor network, connects through the SOCKS proxy and checks with the Tor
      # Project that the request came out of Tor.
      - name: Test Tor through the Tor network
        working-directory: comms-crypto
        timeout-minutes: 10
        run: cargo test --release --lib -- --ignored tor_

      # The licence notices of the crates compiled into the encryption library
      # (comms-crypto/about.toml), regenerated with the pinned cargo-about and
      # compared with what is committed, so a Cargo.lock change cannot ship
      # without them. --frozen keeps cargo-about off the network: the output
      # depends on Cargo.lock alone. The app's notices are built from
      # android/app/notices/rust-crates.json (thirdPartyNotices in
      # android/app/build.gradle.kts).
      - name: Check the Rust crates' licence notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo fetch --locked --manifest-path comms-crypto/Cargo.toml
          cargo about generate --frozen --fail -m comms-crypto/Cargo.toml comms-crypto/about-json.hbs -o android/app/notices/rust-crates.json
          cargo about generate --frozen --fail -m comms-crypto/Cargo.toml comms-crypto/about.hbs -o THIRD-PARTY-NOTICES.md
          if ! git diff --exit-code -- android/app/notices/rust-crates.json THIRD-PARTY-NOTICES.md; then
            echo "::error::The crates' licence notices differ from Cargo.lock: regenerate them with the commands in comms-crypto/about.toml and commit the result"
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The release checks' own tests first: a library linked for 4 KB pages has to
      # fail the page check, and an APK signed by another key the signer check.
      - name: Test the 16 KB page and bundle signer checks
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q tools/android

      # Android 15+ devices with 16 KB pages load only libraries built for them, and
      # Google Play requires it: every LOAD segment of each 64-bit library must be
      # 0x4000-aligned and the APK must place the libraries on 16 KiB boundaries
      # (zipalign -c -P 16 -v 4). Today that holds because cargo-ndk 4.1.2 passes
      # max-page-size for NDK 27; this step fails the build the day it stops holding.
      - name: Check the native libraries are built for 16 KB pages
        run: tools/android/check-16k-alignment.sh android/app/build/outputs/apk/*/debug/*.apk

      # The Kotlin unit tests: detectors, routing, comms wire formats, the tour's
      # coverage. They used to be run by nobody; a build that compiles is not one
      # whose detectors work.
      - name: Kotlin unit tests
        working-directory: android
        run: |
          ./gradlew testFullSuiteDebugUnitTest --no-daemon --stacktrace

      # The foss edition is the one F-Droid would build, and F-Droid's main repository
      # takes no proprietary dependency: no Google Play services or Firebase artifact
      # may reach its runtime classpath, and no such class or file its APKs (built by
      # assembleDebug above). The script's own tests ran with the other tools/android
      # tests. The edition's unit tests include src/testFoss (no fused client, no
      # Play services class loadable).
      - name: Check the foss edition has no Google Play services or Firebase
        working-directory: android
        run: |
          for c in fossSuiteReleaseRuntimeClasspath fossCommsReleaseRuntimeClasspath; do
            ./gradlew -q :app:dependencies --configuration "$c" --no-daemon > "$RUNNER_TEMP/$c.txt"
          done
          ../tools/android/check-no-google-services.sh \
            --deps "$RUNNER_TEMP"/foss*RuntimeClasspath.txt \
            --apk app/build/outputs/apk/fossSuite/debug/*.apk app/build/outputs/apk/fossComms/debug/*.apk
          ./gradlew testFossSuiteDebugUnitTest --tests 'app.clairix.analysis.FossEditionTest' --no-daemon --stacktrace

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      # Every debug variant: the full edition's whole app (app-full-suite-debug.apk)
      # and comms-only build (app-full-comms-debug.apk), the Play edition
      # (app-play-suite-debug.apk), and the foss edition's two
      # (app-foss-suite-debug.apk, app-foss-comms-debug.apk).
      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clairix-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      # The committed screenshots (src/test/snapshots) are compared, not only
      # drawn: a plain test run renders each screen and compares nothing, and
      # verifyPaparazzi is what switches comparison on. Only the screenshot
      # tests run again; the step above has run every test once.
      - name: Verify the screenshots
        if: ${{ !inputs.record_screenshots }}
        working-directory: android
        run: |
          ./gradlew testFullSuiteDebugUnitTest --tests 'app.clairix.screenshots.*' verifyPaparazziFullSuiteDebug \
            --no-daemon --stacktrace

      - name: Upload the screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paparazzi-failures
          path: android/app/build/paparazzi/failures/
          if-no-files-found: ignore

      # Rendering depends on the JDK and the fonts it finds, so the goldens are
      # recorded here, on the runner that compares them: run this workflow by
      # hand with record_screenshots and commit the artifact's PNGs.
      - name: Record the screenshots
        if: ${{ inputs.record_screenshots }}
        working-directory: android
        run: |
          ./gradlew testFullSuiteDebugUnitTest --tests 'app.clairix.screenshots.*' recordPaparazziFullSuiteDebug \
            --no-daemon --stacktrace

      - name: Keep the recorded screenshots
        if: ${{ inputs.record_screenshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-screenshots
          path: android/app/src/test/snapshots/images/
          if-no-files-found: error

      # Android Lint and detekt with every warning an error. What each found
      # when it was switched on is listed in app/lint-baseline.xml and
      # app/detekt-baseline.xml and tolerated until fixed; anything new fails.
      - name: Android Lint
        working-directory: android
        run: ./gradlew lintFullSuiteDebug --no-daemon --stacktrace

      - name: detekt
        working-directory: android
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Upload the lint and detekt reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            android/app/build/reports/lint-results-*
            android/app/build/reports/detekt/
          if-no-files-found: ignore

  # Two builds of one commit on two machines must come out the same, or a
  # published APK can never be checked against the source. Each copy builds
  # the full edition with no keystore in the environment, and compare-builds
  # requires the two to agree: the release APK, which Gradle writes unsigned
  # without a keystore, byte for byte, and the debug APK entry for entry
  # (each machine signs it with a debug key it makes for itself). No Rust
  # cache here: a restored target directory would hide a difference, not
  # show it.
  reproducible-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        copy: [first, second]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK, the API 36 platform and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The debug APK always; the release APK, unsigned, once the asset signing
      # public key is committed. A release build refuses to run without it (see
      # android/app/build.gradle.kts), so the check grows to cover releases the
      # moment releases become possible.
      - name: Build the full edition
        working-directory: android
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          TASKS="assembleFullSuiteDebug"
          if [ -f asset-signing.pub ]; then
            TASKS="$TASKS assembleFullSuiteRelease"
          else
            echo "::notice::android/asset-signing.pub is not committed yet, so no release build is possible; the debug build alone is compared"
          fi
          ./gradlew $TASKS --no-daemon --stacktrace
          OUT=app/build/outputs/reproducible
          mkdir -p "$OUT"
          cp app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk "$OUT/"
          if [ -f asset-signing.pub ]; then
            cp app/build/outputs/apk/fullSuite/release/app-full-suite-release-unsigned.apk "$OUT/"
          fi
          sha256sum "$OUT"/*.apk

      # The library must carry no path from this machine, or a build from any
      # other directory differs for no reason (see cargoNdkBuild in
      # android/app/build.gradle.kts). The unstripped libraries are checked:
      # their debug info is where such a path would survive.
      - name: Check the crypto library for build-machine paths
        run: |
          shopt -s nullglob
          found=0; checked=0
          for so in android/app/build/rust/jniLibs/*/libclairix_comms_crypto.so; do
            checked=$((checked + 1))
            if strings "$so" | grep -E -m 5 "$GITHUB_WORKSPACE|/home/runner|\.cargo/registry"; then
              echo "::error file=$so::carries a path from the build machine"; found=1
            fi
          done
          if [ "$checked" = 0 ]; then
            echo "::error::No library found under android/app/build/rust/jniLibs; the check proved nothing"; exit 1
          fi
          if [ "$found" = 0 ]; then echo "No build-machine path in $checked libraries."; fi
          exit $found

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducible-${{ matrix.copy }}
          path: android/app/build/outputs/reproducible/*.apk
          if-no-files-found: error

  compare-builds:
    needs: reproducible-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reproducible-*
          path: builds

      - name: Require the two builds to agree
        run: tools/reproducible/compare-builds.sh builds/reproducible-first builds/reproducible-second
