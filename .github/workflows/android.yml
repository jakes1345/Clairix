name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# The job only reads the repository; third-party actions get no wider token.
# Every action is pinned to a commit, not a tag: a tag can be moved to code
# that was never reviewed, a commit cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships Android SDK (API 35, build-tools 35.x) and an NDK, and
      # sets ANDROID_HOME and ANDROID_NDK_LATEST_HOME, so no separate setup action
      # is needed.

      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # No wrapper jar is committed, so Gradle is installed by the action and
      # put on PATH. Keeps a binary out of the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      # ANDROID_NDK_LATEST_HOME is a runner environment variable, not a workflow
      # `env.` value, so it is read in the shell rather than in an expression.
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          gradle assembleDebug --no-daemon --stacktrace

      # Every debug variant: the full edition's whole app (app-full-suite-debug.apk)
      # and comms-only build (app-full-comms-debug.apk), and the Play edition
      # (app-play-suite-debug.apk).
      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clairix-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
