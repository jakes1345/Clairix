name: Emulator smoke test

# Boots a real Android emulator, installs the full edition's debug build and drives
# every screen through src/androidTest/.../SmokeTest.kt: onboarding, the whole tour,
# every Scan category and tracker tool, every tab and Settings. A crash, an ANR or a
# screen that never appears fails the job; screenshots of every screen and the
# device log are uploaded either way.
#
# Then the end-to-end run (src/androidTest/.../comms/EndToEndTest.kt): two real relays
# (the Worker under wrangler dev, on this runner) reached from the emulator through
# adb reverse, the app registered on one through its own code, and scripted peers on
# both. Texts both ways with receipts, a voice note, a three-chunk photo, a group,
# disappearing messages, a call that rings, and a contact on the other relay, every
# envelope spending a blind token and going through the relay's mixing.
#
# Then, on the same emulator: an eight-minute soak (SoakTest), the app over the real
# Tor network (TorDeviceTest), and last, since they move the app's vault keys, the
# lock screen tests (VaultLockScreenTest).
#
# The APKs are built once (job build) and every step above runs on four emulators,
# Android 12 (API 31, the oldest Clairix runs on), 13, 14 and 15 (job smoke).
#
# The emulator is started with the SDK's own tools rather than a third-party action:
# every action here is pinned to a commit.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'comms-worker/**'
      - '.github/workflows/emulator.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'comms-worker/**'
      - '.github/workflows/emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The app and its instrumentation tests, built once for every device below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the app and the smoke test
        working-directory: android
        run: |
          ./gradlew assembleFullSuiteDebug assembleFullSuiteDebugAndroidTest --no-daemon --stacktrace

      - name: Keep the APKs for the devices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk
            android/app/build/outputs/apk/androidTest/fullSuite/debug/app-full-suite-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  # Every Android version from the oldest Clairix runs on (minSdk 31) to the
  # newest: each runs the smoke test, the end-to-end tests, the soak test, the
  # Tor tests and the lock screen tests on its own emulator.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api: ['31', '33', '34', '35']
    env:
      API: ${{ matrix.api }}
      IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      # A real Tor onion service in front of relay B, as selfhost/install.sh
      # sets one up: started first, so it is published on the Tor network long
      # before the Tor tests look for it. Relay B names it at GET / (RELAY_ONION).
      - name: Start an onion service for relay B
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tor > /dev/null
          mkdir -p "$RUNNER_TEMP/tor/data" "$RUNNER_TEMP/tor/relay-b"
          chmod 700 "$RUNNER_TEMP/tor/data" "$RUNNER_TEMP/tor/relay-b"
          cat > "$RUNNER_TEMP/tor/torrc" <<EOF
          SocksPort 0
          DataDirectory $RUNNER_TEMP/tor/data
          HiddenServiceDir $RUNNER_TEMP/tor/relay-b
          HiddenServiceVersion 3
          HiddenServicePort 80 127.0.0.1:8788
          EOF
          nohup tor -f "$RUNNER_TEMP/tor/torrc" > tor-onion.log 2>&1 &
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/tor/relay-b/hostname" ] && break; sleep 1; done
          ONION_HOST="$(cat "$RUNNER_TEMP/tor/relay-b/hostname")"
          echo "$ONION_HOST" | grep -Eq '^[a-z2-7]{56}\.onion$' || { echo "::error::Tor did not make the onion service"; cat tor-onion.log; exit 1; }
          echo "RELAY_B_ONION=http://$ONION_HOST" >> "$GITHUB_ENV"

      # Two relays side by side, each with storage of its own: A under
      # `wrangler dev`, B as the self-hosted build (selfhost/) under plain
      # workerd, so every cross-relay test also runs a self-hosted relay. A
      # relay reached over plain http on 127.0.0.1 admits other loopback relays
      # as addresses (federation.ts isLoopbackDev), which a deployed relay never
      # does; B is built --allow-loopback to reach A at all.
      - name: Start two local relays
        working-directory: comms-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --no-audit --no-fund
          nohup npx wrangler dev --ip 127.0.0.1 --port 8787 --inspector-port 9229 \
            --persist-to "$RUNNER_TEMP/relay-a" \
            --var ENROLL_SECRET:e2e-enrollment-secret-0123456789 --var MIX_MAX_MS:2000 \
            > ../relay-a.log 2>&1 &
          mkdir -p "$RUNNER_TEMP/relay-b"
          node selfhost/build.mjs --out "$RUNNER_TEMP/relay-b-build" --state "$RUNNER_TEMP/relay-b" \
            --listen 127.0.0.1:8788 --cron-listen 127.0.0.1:8790 --allow-loopback
          ENROLL_SECRET=e2e-enrollment-secret-0123456789 MIX_MAX_MS=2000 RELAY_ONION="$RELAY_B_ONION" \
            nohup node_modules/.bin/workerd serve --experimental "$RUNNER_TEMP/relay-b-build/relay.capnp" \
            > ../relay-b.log 2>&1 &
          for port in 8787 8788; do
            for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$port/" > /dev/null && break; sleep 2; done
            curl -sf "http://127.0.0.1:$port/" || { echo "::error::The relay on $port did not start"; cat ../relay-*.log; exit 1; }
            echo
          done
          curl -sf http://127.0.0.1:8788/ | grep -q "\"onion\":\"$RELAY_B_ONION\"" || { echo "::error::Relay B does not name its onion address"; exit 1; }

      - name: Fetch the APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apks
          path: android/app/build/outputs/apk

      # Hosted Linux runners have KVM; the runner user needs access to it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # avdmanager and the emulator do not agree on where AVDs live by default
      # (the emulator looked only in $HOME/.android/avd and found nothing), so
      # both are told, and the step fails here if the emulator cannot see it.
      - name: Install the emulator and system image
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install emulator "$IMAGE" platform-tools > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$IMAGE" -d pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee avds.txt
          grep -qx smoke avds.txt || { echo "::error::The emulator cannot see the AVD just created"; ls -la "$ANDROID_AVD_HOME" "$HOME/.android" || true; exit 1; }

      # Never `adb wait-for-device` alone: an emulator that dies at start leaves it
      # waiting until the job's timeout, with nothing in the log to say why.
      - name: Boot the emulator
        timeout-minutes: 20
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -accel on > emulator.log 2>&1 &
          EMU=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          booted=
          for i in $(seq 1 180); do
            if ! kill -0 "$EMU" 2>/dev/null; then
              echo "::error::The emulator exited before it booted"
              tail -n 120 emulator.log
              exit 1
            fi
            if [ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [ -z "$booted" ]; then
            echo "::error::The emulator did not finish booting in 15 minutes"
            tail -n 120 emulator.log
            "$ADB" devices -l || true
            exit 1
          fi
          echo "Booted after about $((i * 5)) s"
          # sys.boot_completed comes before user 0 is fully unlocked, and finishing
          # the unlock brings the home screen back to the front: an app started
          # in between is covered at once (Android 13 on e771fa6, "app did not
          # come up"). Wait for the unlock, then for the launcher to hold focus.
          for i in $(seq 1 60); do
            state="$(timeout 10 "$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r')"
            case "$state" in *RUNNING_UNLOCKED*) break ;; esac
            sleep 2
          done
          echo "User 0: $state"
          for i in $(seq 1 60); do
            timeout 10 "$ADB" shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus=.*[Ll]auncher" && break
            sleep 2
          done
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82

      - name: Run the smoke test
        working-directory: android
        timeout-minutes: 30
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          "$ADB" install -r -g app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk
          "$ADB" install -r app/build/outputs/apk/androidTest/fullSuite/debug/app-full-suite-debug-androidTest.apk
          # An accessibility service on, so Compose reports screen changes to
          # UiAutomator on every version (NoopAccessibilityService, FreshUi).
          "$ADB" shell settings put secure enabled_accessibility_services app.clairix.test/app.clairix.NoopAccessibilityService
          "$ADB" shell settings put secure accessibility_enabled 1
          "$ADB" shell settings get secure enabled_accessibility_services
          set +e
          timeout 1500 "$ADB" shell am instrument -w -r app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../instrument.txt
          set -e
          "$ADB" logcat -d > ../logcat.txt
          mkdir -p ../screens
          "$ADB" pull /sdcard/Android/data/app.clairix/files/smoke ../screens || true
          # The instrumentation output says OK only when every test passed; a crash
          # anywhere in the app shows as FATAL EXCEPTION in the log, with the
          # process named on the next line (other apps on the emulator crash too:
          # Gmail did on API 31, run 40272070286).
          if grep -A1 "FATAL EXCEPTION" ../logcat.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the smoke test; see logcat.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat.txt | head -80
            exit 1
          fi
          grep -q "^OK (" ../instrument.txt || { echo "::error::The smoke test failed; see instrument.txt"; exit 1; }

      # The smoke test leaves the scanner running, and with it the GPS check's
      # raw-measurement listener (GnssMonitor). The emulator's GNSS HAL
      # (gnss@2.0-service.ranchu) deadlocks when Android stops and restarts
      # measurement collection as an app's foreground state changes, and the
      # system watchdog then kills the whole system (seen on Android 12 and 13
      # during the soak test). Everything from here on tests messaging, so the
      # scanner is stopped first; who held the listeners is kept for the record.
      - name: Stop the scanner the smoke test started
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell dumpsys location > location-after-smoke.txt 2>&1 || true
          "$ADB" shell am force-stop app.clairix

      - name: Run the end-to-end tests against the two relays
        working-directory: android
        timeout-minutes: 20
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" reverse tcp:8787 tcp:8787
          "$ADB" reverse tcp:8788 tcp:8788
          "$ADB" logcat -c
          set +e
          timeout 1100 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.EndToEndTest \
            -e relayA http://127.0.0.1:8787 -e relayB http://127.0.0.1:8788 \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../e2e.txt
          set -e
          "$ADB" logcat -d > ../logcat-e2e.txt
          if grep -A1 "FATAL EXCEPTION" ../logcat-e2e.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the end-to-end tests; see logcat-e2e.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-e2e.txt | head -80
            exit 1
          fi
          grep -q "^OK (10 tests)" ../e2e.txt || { echo "::error::The end-to-end tests failed; see e2e.txt"; exit 1; }
          # Every test must have run: a skipped one (status -4 for an unmet assumption,
          # -3 for an ignored test) means the relays were not passed through.
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../e2e.txt; then echo "::error::End-to-end tests were skipped"; exit 1; fi

      # A long conversation on the same two relays: texts both ways with a
      # contact on each, photos, the vault sealing and opening, the socket
      # dropped; nothing lost, nothing twice, and memory that stops growing.
      - name: Run the soak test
        working-directory: android
        timeout-minutes: 20
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 1100 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.SoakTest -e soakMinutes 8 \
            -e relayA http://127.0.0.1:8787 -e relayB http://127.0.0.1:8788 \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../soak.txt
          set -e
          "$ADB" logcat -d > ../logcat-soak.txt
          grep "SoakTest" ../logcat-soak.txt | tail -20 || true
          if grep -A1 "FATAL EXCEPTION" ../logcat-soak.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the soak test; see logcat-soak.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-soak.txt | head -80
            exit 1
          fi
          grep -q "^OK (1 test)" ../soak.txt || { echo "::error::The soak test failed; see soak.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../soak.txt; then echo "::error::The soak test was skipped"; exit 1; fi

      # The app over the real Tor network (Arti on the phone, through its own
      # SOCKS proxy): requests come out of Tor, the listed relay answers with
      # its listed key, the app keeps working with relay B reachable only at
      # its onion address, and with Tor on but its proxy gone nothing goes out.
      - name: Run the Tor tests
        working-directory: android
        timeout-minutes: 25
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 1400 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.TorDeviceTest -e tor true \
            -e onionRelay http://127.0.0.1:8788 -e onion "$RELAY_B_ONION" \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../tor.txt
          set -e
          "$ADB" logcat -d > ../logcat-tor.txt
          if grep -A1 "FATAL EXCEPTION" ../logcat-tor.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the Tor tests; see logcat-tor.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-tor.txt | head -80
            exit 1
          fi
          grep -q "^OK (4 tests)" ../tor.txt || { echo "::error::The Tor tests failed; see tor.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../tor.txt; then echo "::error::Tor tests were skipped"; exit 1; fi

      - name: Run the lock screen tests
        working-directory: android
        timeout-minutes: 10
        run: |
          # Last of all: these set and clear a PIN, and the app's own vault keys
          # move with it, so nothing that uses the app's data may run after them.
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 500 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.VaultLockScreenTest -e lockScreen true \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../lockscreen.txt
          set -e
          "$ADB" logcat -d > ../logcat-lockscreen.txt
          # Whatever happened, the emulator is left with no PIN.
          "$ADB" shell locksettings clear --old 1590 >/dev/null 2>&1 || true
          grep "VaultLockScreenTest" ../logcat-lockscreen.txt || true
          if grep -A1 "FATAL EXCEPTION" ../logcat-lockscreen.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the lock screen tests; see logcat-lockscreen.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-lockscreen.txt | head -80
            exit 1
          fi
          grep -q "^OK (2 tests)" ../lockscreen.txt || { echo "::error::The lock screen tests failed; see lockscreen.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../lockscreen.txt; then echo "::error::Lock screen tests were skipped"; exit 1; fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-smoke-api${{ matrix.api }}
          path: |
            screens/
            instrument.txt
            logcat.txt
            e2e.txt
            logcat-e2e.txt
            lockscreen.txt
            logcat-lockscreen.txt
            tor.txt
            logcat-tor.txt
            soak.txt
            logcat-soak.txt
            relay-a.log
            relay-b.log
            tor-onion.log
            location-after-smoke.txt
            emulator.log
          if-no-files-found: warn
