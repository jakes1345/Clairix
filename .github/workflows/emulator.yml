name: Emulator smoke test

# Boots a real Android emulator, installs the full edition's debug build and drives
# every screen through src/androidTest/.../SmokeTest.kt: onboarding, the whole tour,
# every Scan category and tracker tool, every tab and Settings. A crash, an ANR or a
# screen that never appears fails the job; screenshots of every screen and the
# device log are uploaded either way.
#
# Then the end-to-end run (src/androidTest/.../comms/EndToEndTest.kt): two real relays
# (the Worker under wrangler dev, on this runner) reached from the emulator through
# adb reverse, the app registered on one through its own code, and scripted peers on
# both. Texts both ways with receipts, a voice note, a three-chunk photo, a group,
# disappearing messages, a call that rings, a contact on the other relay, and an SOS
# sent while relay A is away (this runner removes its adb reverse port when the test
# asks) that goes once it is back. Every envelope spends a blind token, and all but
# calls, SOS alerts and group changes go through the relay's mixing.
#
# Power budgets (.github/scripts/power_budget.py, docs/audit/POWER.md): after the smoke
# test, ten minutes with the scanner running, the screen off and the emulator's battery
# unplugged, then the scanner settled by a debug broadcast; after the soak, ten minutes
# with comms online. Android's own counters (batterystats, alarm, power, location) must
# show at most 60 s of wake locks and one wake-up alarm per ten minutes, no wake lock
# held without a timeout, no Bluetooth scan once the scanner has stopped and no
# satellite measurement request holding the receiver on while the scanner is settled.
#
# Then, on the same emulator: an eight-minute soak (SoakTest), moving between the two
# relays (RelayMoveTest), the app over the real Tor network (TorDeviceTest), and last,
# since they move the app's vault keys, the lock screen tests (VaultLockScreenTest).
#
# After those, the app is installed again without -g and walked through onboarding
# and every Scan category with its runtime permissions refused, all at once and one
# at a time (PermissionsDeniedDeviceTest); every earlier step runs with them granted.
#
# The APKs are built once (job build) and every step above runs on five emulators,
# Android 12 (API 31, the oldest Clairix runs on), 13, 14 and 15 with Google APIs, and
# Android 15 without them (the plain AOSP image), as a phone without Google Play
# services is (job smoke). Nothing the tests drive needs Google Play services, so the
# AOSP emulator runs every step the others do.
#
# The emulator is started with the SDK's own tools rather than a third-party action:
# every action here is pinned to a commit.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'comms-worker/**'
      - '.github/workflows/emulator.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'comms-crypto/**'
      - 'comms-worker/**'
      - '.github/workflows/emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The app and its instrumentation tests, built once for every device below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build the app and the smoke test
        working-directory: android
        run: |
          ./gradlew assembleFullSuiteDebug assembleFullSuiteDebugAndroidTest --no-daemon --stacktrace

      - name: Keep the APKs for the devices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk
            android/app/build/outputs/apk/androidTest/fullSuite/debug/app-full-suite-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  # Every Android version from the oldest Clairix runs on (minSdk 31) to the
  # newest: each runs the smoke test, the end-to-end tests, the soak test, the
  # Tor tests and the lock screen tests on its own emulator.
  smoke:
    # "smoke (31)" as before for the Google APIs images, "smoke (35, AOSP)" for the other.
    name: smoke (${{ matrix.api }}${{ matrix.image == 'default' && ', AOSP' || '' }})
    needs: build
    runs-on: ubuntu-latest
    # Ten walks with permissions refused (about two minutes each) came on top of the rest.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        api: ['31', '33', '34', '35']
        image: ['google_apis']
        # And a phone without Google Play services, as GrapheneOS and LineageOS
        # phones are: the AOSP image. Positions come from Android's own location
        # service there (analysis/LocationClient.kt), and the smoke test starts
        # the scanner, the GPS page and the Drive map on that path.
        include:
          - api: '35'
            image: 'default'
    env:
      API: ${{ matrix.api }}
      IMAGE: system-images;android-${{ matrix.api }};${{ matrix.image }};x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      # A real Tor onion service in front of relay B, as selfhost/install.sh
      # sets one up: started first, so it is published on the Tor network long
      # before the Tor tests look for it. Relay B names it at GET / (RELAY_ONION).
      - name: Start an onion service for relay B
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tor > /dev/null
          mkdir -p "$RUNNER_TEMP/tor/data" "$RUNNER_TEMP/tor/relay-b"
          chmod 700 "$RUNNER_TEMP/tor/data" "$RUNNER_TEMP/tor/relay-b"
          cat > "$RUNNER_TEMP/tor/torrc" <<EOF
          SocksPort 0
          DataDirectory $RUNNER_TEMP/tor/data
          HiddenServiceDir $RUNNER_TEMP/tor/relay-b
          HiddenServiceVersion 3
          HiddenServicePort 80 127.0.0.1:8788
          EOF
          nohup tor -f "$RUNNER_TEMP/tor/torrc" > tor-onion.log 2>&1 &
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/tor/relay-b/hostname" ] && break; sleep 1; done
          ONION_HOST="$(cat "$RUNNER_TEMP/tor/relay-b/hostname")"
          echo "$ONION_HOST" | grep -Eq '^[a-z2-7]{56}\.onion$' || { echo "::error::Tor did not make the onion service"; cat tor-onion.log; exit 1; }
          echo "RELAY_B_ONION=http://$ONION_HOST" >> "$GITHUB_ENV"

      # Two relays side by side, each with storage of its own: A under
      # `wrangler dev`, B as the self-hosted build (selfhost/) under plain
      # workerd, so every cross-relay test also runs a self-hosted relay. A
      # relay reached over plain http on 127.0.0.1 admits other loopback relays
      # as addresses (federation.ts isLoopbackDev), which a deployed relay never
      # does; B is built --allow-loopback to reach A at all. Both issue 20,000
      # delivery tokens an hour instead of 1,000: the soak test sends more in
      # its eight minutes than a person does in an hour, and would otherwise
      # wait for the next hour's allowance (correctly, but past its timeouts).
      - name: Start two local relays
        working-directory: comms-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --no-fund
          nohup npx wrangler dev --ip 127.0.0.1 --port 8787 --inspector-port 9229 \
            --persist-to "$RUNNER_TEMP/relay-a" \
            --var ENROLL_SECRET:e2e-enrollment-secret-0123456789 --var MIX_MAX_MS:2000 \
            --var DELIVERY_TOKENS_PER_HOUR:20000 \
            > ../relay-a.log 2>&1 &
          mkdir -p "$RUNNER_TEMP/relay-b"
          node selfhost/build.mjs --out "$RUNNER_TEMP/relay-b-build" --state "$RUNNER_TEMP/relay-b" \
            --listen 127.0.0.1:8788 --cron-listen 127.0.0.1:8790 --allow-loopback
          ENROLL_SECRET=e2e-enrollment-secret-0123456789 MIX_MAX_MS=2000 RELAY_ONION="$RELAY_B_ONION" DELIVERY_TOKENS_PER_HOUR=20000 \
            nohup node_modules/.bin/workerd serve --experimental "$RUNNER_TEMP/relay-b-build/relay.capnp" \
            > ../relay-b.log 2>&1 &
          for port in 8787 8788; do
            for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$port/" > /dev/null && break; sleep 2; done
            curl -sf "http://127.0.0.1:$port/" || { echo "::error::The relay on $port did not start"; cat ../relay-*.log; exit 1; }
            echo
          done
          curl -sf http://127.0.0.1:8788/ | grep -q "\"onion\":\"$RELAY_B_ONION\"" || { echo "::error::Relay B does not name its onion address"; exit 1; }

      - name: Fetch the APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apks
          path: android/app/build/outputs/apk

      # Hosted Linux runners have KVM; the runner user needs access to it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # avdmanager and the emulator do not agree on where AVDs live by default
      # (the emulator looked only in $HOME/.android/avd and found nothing), so
      # both are told, and the step fails here if the emulator cannot see it.
      - name: Install the emulator and system image
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install emulator "$IMAGE" platform-tools > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "$IMAGE" -d pixel_6 --force
          # The image's default data partition and the emulator's overhead need
          # about 7.2 GB free, which a runner did not always have (API 34 on
          # 6fc3884: "Not enough space to create userdata partition. Available:
          # 7342.07 MB, need 7372.80 MB"). The app and its tests need far less.
          CFG="$ANDROID_AVD_HOME/smoke.avd/config.ini"
          if grep -q '^disk.dataPartition.size' "$CFG"; then
            sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=4096M/' "$CFG"
          else
            echo 'disk.dataPartition.size=4096M' >> "$CFG"
          fi
          grep '^disk.dataPartition.size' "$CFG"
          df -h "$ANDROID_AVD_HOME" | tail -1
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee avds.txt
          grep -qx smoke avds.txt || { echo "::error::The emulator cannot see the AVD just created"; ls -la "$ANDROID_AVD_HOME" "$HOME/.android" || true; exit 1; }

      # Never `adb wait-for-device` alone: an emulator that dies at start leaves it
      # waiting until the job's timeout, with nothing in the log to say why.
      - name: Boot the emulator
        timeout-minutes: 20
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          "$ANDROID_HOME/emulator/emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 -accel on > emulator.log 2>&1 &
          EMU=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          booted=
          for i in $(seq 1 180); do
            if ! kill -0 "$EMU" 2>/dev/null; then
              echo "::error::The emulator exited before it booted"
              tail -n 120 emulator.log
              exit 1
            fi
            if [ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [ -z "$booted" ]; then
            echo "::error::The emulator did not finish booting in 15 minutes"
            tail -n 120 emulator.log
            "$ADB" devices -l || true
            exit 1
          fi
          echo "Booted after about $((i * 5)) s"
          # sys.boot_completed comes before user 0 is fully unlocked, and finishing
          # the unlock brings the home screen back to the front: an app started
          # in between is covered at once (Android 13 on e771fa6, "app did not
          # come up"). Wait for the unlock, then for the launcher to hold focus.
          for i in $(seq 1 60); do
            state="$(timeout 10 "$ADB" shell am get-started-user-state 0 2>/dev/null | tr -d '\r')"
            case "$state" in *RUNNING_UNLOCKED*) break ;; esac
            sleep 2
          done
          echo "User 0: $state"
          for i in $(seq 1 60); do
            timeout 10 "$ADB" shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus=.*[Ll]auncher" && break
            sleep 2
          done
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82

      - name: Run the smoke test
        working-directory: android
        timeout-minutes: 30
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          "$ADB" install -r -g app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk
          "$ADB" install -r app/build/outputs/apk/androidTest/fullSuite/debug/app-full-suite-debug-androidTest.apk
          # An accessibility service on, so Compose reports screen changes to
          # UiAutomator on every version (NoopAccessibilityService, FreshUi).
          "$ADB" shell settings put secure enabled_accessibility_services app.clairix.test/app.clairix.NoopAccessibilityService
          "$ADB" shell settings put secure accessibility_enabled 1
          "$ADB" shell settings get secure enabled_accessibility_services
          set +e
          timeout 1500 "$ADB" shell am instrument -w -r app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../instrument.txt
          set -e
          "$ADB" logcat -d > ../logcat.txt
          mkdir -p ../screens
          "$ADB" pull /sdcard/Android/data/app.clairix/files/smoke ../screens || true
          # The instrumentation output says OK only when every test passed; a crash
          # anywhere in the app shows as FATAL EXCEPTION in the log, with the
          # process named on the next line (other apps on the emulator crash too:
          # Gmail did on API 31, run 40272070286).
          if grep -A1 "FATAL EXCEPTION" ../logcat.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the smoke test; see logcat.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat.txt | head -80
            exit 1
          fi
          grep -q "^OK (" ../instrument.txt || { echo "::error::The smoke test failed; see instrument.txt"; exit 1; }

      # The smoke test leaves the scanner running. Ten minutes of it with the screen off
      # and the battery unplugged (the emulator counts nothing on the charger), then the
      # platform's counters against the budgets; then the scanner is settled by the debug
      # build's broadcast (analysis/DebugPace.kt) and its satellite measurement requests
      # read again. Every dump is kept, pass or fail.
      - name: Power budget with the scanner running
        timeout-minutes: 16
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          BUDGET="$GITHUB_WORKSPACE/.github/scripts/power_budget.py"
          mkdir -p power
          APP_UID="$("$ADB" shell pm list packages -U app.clairix | tr -d '\r' | sed -n 's/^package:app\.clairix uid:\([0-9]*\).*/\1/p' | head -1)"
          [ -n "$APP_UID" ] || { echo "::error::Could not read Clairix's uid"; exit 1; }
          echo "$APP_UID" > power/uid.txt
          # The instrumentation runs in the app's process, and Android ends that
          # process when the run finishes, scanner and all. Opening the app starts
          # the scanner again (MainActivity.reconcileScanner, scanning having been
          # turned on during the smoke run); then home, so the window measures the
          # scanner in the background as an owner leaves it.
          "$ADB" shell am start -W -n app.clairix/.MainActivity > /dev/null
          for i in $(seq 1 30); do
            "$ADB" shell dumpsys activity services app.clairix/.ScanService > power/scanner-service.txt 2>&1 || true
            grep -q "ServiceRecord" power/scanner-service.txt && break
            sleep 2
          done
          "$ADB" shell input keyevent KEYCODE_HOME
          grep -q "ServiceRecord" power/scanner-service.txt || { echo "::error::The scanner was not running when the power window began, so there was nothing to measure; see power/scanner-service.txt"; exit 1; }
          # A scanner just started counts the phone as moving until it has seen
          # no movement for minutes (MotionPolicy.STILL_AFTER_MS): precise fixes
          # every 15 s, and the network-location wake-ups they bring. The window
          # judges scenario S1, a phone lying still with the scanner running
          # (docs/audit/POWER.md), so the scanner is settled first, as it would
          # be by then on a phone on a table.
          "$ADB" shell am broadcast -a app.clairix.debug.FORCE_STILL -p app.clairix > /dev/null
          sleep 20
          "$ADB" shell dumpsys battery unplug
          "$ADB" shell dumpsys batterystats --reset
          "$ADB" shell input keyevent KEYCODE_SLEEP
          sleep 600
          "$ADB" shell dumpsys batterystats --charged app.clairix > power/scanner-batterystats.txt 2>&1
          "$ADB" shell dumpsys alarm > power/scanner-alarm.txt 2>&1
          "$ADB" shell dumpsys power > power/scanner-power.txt 2>&1
          "$ADB" shell dumpsys location > power/scanner-location.txt 2>&1
          failed=0
          python3 "$BUDGET" --uid "$APP_UID" --label scanner --report power/scanner.json \
            --batterystats power/scanner-batterystats.txt --power power/scanner-power.txt \
            --alarm power/scanner-alarm.txt --location power/scanner-location.txt || failed=1
          "$ADB" shell am broadcast -a app.clairix.debug.FORCE_STILL -p app.clairix
          sleep 30
          "$ADB" shell dumpsys location > power/settled-location.txt 2>&1
          python3 "$BUDGET" --uid "$APP_UID" --label settled --report power/settled.json \
            --location power/settled-location.txt --settled || failed=1
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell dumpsys battery reset
          exit $failed

      # The smoke test leaves the scanner running, and with it the GPS check's
      # raw-measurement listener (GnssMonitor). The emulator's GNSS HAL
      # (gnss@2.0-service.ranchu) deadlocks when Android stops and restarts
      # measurement collection as an app's foreground state changes, and the
      # system watchdog then kills the whole system (seen on Android 12 and 13
      # during the soak test). Everything from here on tests messaging, so the
      # scanner is stopped first; who held the listeners is kept for the record.
      - name: Stop the scanner the smoke test started
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell dumpsys location > location-after-smoke.txt 2>&1 || true
          "$ADB" shell am force-stop app.clairix

      - name: Run the end-to-end tests against the two relays
        working-directory: android
        timeout-minutes: 20
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" reverse tcp:8787 tcp:8787
          "$ADB" reverse tcp:8788 tcp:8788
          "$ADB" logcat -c
          # The SOS test (k_) needs relay A to go away mid-test and come back,
          # which only this runner can do. When the test logs that it is ready,
          # the adb reverse port is removed, so every connection from the phone
          # to relay A is refused, as when the relay is down; it is restored
          # when the test logs that it is done, or after two minutes whatever
          # happens, and once more after the run.
          (
            for i in $(seq 1 1100); do
              if "$ADB" logcat -d -s EndToEndTest:I | grep -q CLAIRIX_E2E_RELAY_A_DOWN; then
                "$ADB" reverse --remove tcp:8787 || true
                echo "relay A taken away after about $i s"
                for j in $(seq 1 120); do
                  "$ADB" logcat -d -s EndToEndTest:I | grep -q CLAIRIX_E2E_RELAY_A_UP && break
                  sleep 1
                done
                "$ADB" reverse tcp:8787 tcp:8787 || true
                echo "relay A back after about $j s"
                break
              fi
              sleep 1
            done
          ) > ../relay-toggle.log 2>&1 &
          TOGGLE=$!
          set +e
          timeout 1100 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.EndToEndTest \
            -e relayA http://127.0.0.1:8787 -e relayB http://127.0.0.1:8788 \
            -e secret e2e-enrollment-secret-0123456789 -e relayToggle true \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../e2e.txt
          set -e
          kill "$TOGGLE" 2>/dev/null || true
          # Whatever the watcher got to, relay A is reachable for the steps after this one.
          "$ADB" reverse tcp:8787 tcp:8787
          "$ADB" logcat -d > ../logcat-e2e.txt
          if grep -A1 "FATAL EXCEPTION" ../logcat-e2e.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the end-to-end tests; see logcat-e2e.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-e2e.txt | head -80
            exit 1
          fi
          grep -q "^OK (12 tests)" ../e2e.txt || { echo "::error::The end-to-end tests failed; see e2e.txt"; exit 1; }
          # Every test must have run: a skipped one (status -4 for an unmet assumption,
          # -3 for an ignored test) means the relays were not passed through.
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../e2e.txt; then echo "::error::End-to-end tests were skipped"; exit 1; fi

      # A long conversation on the same two relays: texts both ways with a
      # contact on each, photos, the vault sealing and opening, the socket
      # dropped; nothing lost, nothing twice, and memory that stops growing.
      - name: Run the soak test
        working-directory: android
        timeout-minutes: 20
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 1100 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.SoakTest -e soakMinutes 8 \
            -e relayA http://127.0.0.1:8787 -e relayB http://127.0.0.1:8788 \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../soak.txt
          set -e
          "$ADB" logcat -d > ../logcat-soak.txt
          grep "SoakTest" ../logcat-soak.txt | tail -20 || true
          if grep -A1 "FATAL EXCEPTION" ../logcat-soak.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the soak test; see logcat-soak.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-soak.txt | head -80
            exit 1
          fi
          grep -q "^OK (1 test)" ../soak.txt || { echo "::error::The soak test failed; see soak.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../soak.txt; then echo "::error::The soak test was skipped"; exit 1; fi

      # Ten minutes with comms online after the soak, the screen off and the battery
      # unplugged: the relay connection's wake locks and alarms against the budgets, and
      # no Bluetooth scan, since the scanner was stopped before the messaging tests.
      - name: Power budget with comms online
        timeout-minutes: 14
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          BUDGET="$GITHUB_WORKSPACE/.github/scripts/power_budget.py"
          mkdir -p power
          APP_UID="$(cat power/uid.txt)"
          "$ADB" shell dumpsys battery unplug
          "$ADB" shell dumpsys batterystats --reset
          "$ADB" shell input keyevent KEYCODE_SLEEP
          sleep 600
          "$ADB" shell dumpsys batterystats --charged app.clairix > power/comms-batterystats.txt 2>&1
          "$ADB" shell dumpsys alarm > power/comms-alarm.txt 2>&1
          "$ADB" shell dumpsys power > power/comms-power.txt 2>&1
          failed=0
          python3 "$BUDGET" --uid "$APP_UID" --label comms --report power/comms.json --no-ble \
            --batterystats power/comms-batterystats.txt --power power/comms-power.txt \
            --alarm power/comms-alarm.txt || failed=1
          "$ADB" shell input keyevent KEYCODE_WAKEUP
          "$ADB" shell dumpsys battery reset
          exit $failed

      # Moving between the same two relays: the app moves from A to B and its
      # contacts (one on each) are told and reach it there, while what still
      # goes to the old number is collected from A; a contact moves and the app
      # follows; the app moves back to A and takes up its old number again.
      - name: Run the relay move tests
        working-directory: android
        timeout-minutes: 15
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 800 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.RelayMoveTest \
            -e relayA http://127.0.0.1:8787 -e relayB http://127.0.0.1:8788 \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../relaymove.txt
          set -e
          "$ADB" logcat -d > ../logcat-relaymove.txt
          if grep -A1 "FATAL EXCEPTION" ../logcat-relaymove.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the relay move tests; see logcat-relaymove.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-relaymove.txt | head -80
            exit 1
          fi
          grep -q "^OK (4 tests)" ../relaymove.txt || { echo "::error::The relay move tests failed; see relaymove.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../relaymove.txt; then echo "::error::Relay move tests were skipped"; exit 1; fi

      # The app over the real Tor network (Arti on the phone, through its own
      # SOCKS proxy): requests come out of Tor, the listed relay answers with
      # its listed key, the app keeps working with relay B reachable only at
      # its onion address, and with Tor on but its proxy gone nothing goes out.
      - name: Run the Tor tests
        working-directory: android
        timeout-minutes: 25
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 1400 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.TorDeviceTest -e tor true \
            -e onionRelay http://127.0.0.1:8788 -e onion "$RELAY_B_ONION" \
            -e secret e2e-enrollment-secret-0123456789 \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../tor.txt
          set -e
          "$ADB" logcat -d > ../logcat-tor.txt
          if grep -A1 "FATAL EXCEPTION" ../logcat-tor.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the Tor tests; see logcat-tor.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-tor.txt | head -80
            exit 1
          fi
          grep -q "^OK (4 tests)" ../tor.txt || { echo "::error::The Tor tests failed; see tor.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../tor.txt; then echo "::error::Tor tests were skipped"; exit 1; fi

      - name: Run the lock screen tests
        working-directory: android
        timeout-minutes: 10
        run: |
          # Last of all: these set and clear a PIN, and the app's own vault keys
          # move with it, so nothing that uses the app's data may run after them.
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 500 "$ADB" shell am instrument -w -r \
            -e class app.clairix.comms.VaultLockScreenTest -e lockScreen true \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../lockscreen.txt
          set -e
          "$ADB" logcat -d > ../logcat-lockscreen.txt
          # Whatever happened, the emulator is left with no PIN.
          "$ADB" shell locksettings clear --old 1590 >/dev/null 2>&1 || true
          grep "VaultLockScreenTest" ../logcat-lockscreen.txt || true
          if grep -A1 "FATAL EXCEPTION" ../logcat-lockscreen.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the lock screen tests; see logcat-lockscreen.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-lockscreen.txt | head -80
            exit 1
          fi
          grep -q "^OK (2 tests)" ../lockscreen.txt || { echo "::error::The lock screen tests failed; see lockscreen.txt"; exit 1; }
          if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../lockscreen.txt; then echo "::error::Lock screen tests were skipped"; exit 1; fi

      - name: Run the card-vault lock test
        working-directory: android
        timeout-minutes: 10
        run: |
          # Also last, and for the same reason: it sets a device PIN so the card
          # vault's key can exist, saves a synthetic ISO-DEP card through it, and
          # checks that an armed card stops answering readers when the app locks.
          # The vault's auth-bound key may refuse to save without a fresh
          # device-credential authentication in this harness; the save step then
          # skips (reported, not failed) while the disarm-on-lock check still runs,
          # so this step tolerates a skipped assumption and only fails on a real one.
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -c
          set +e
          timeout 300 "$ADB" shell am instrument -w -r \
            -e class app.clairix.security.CardVaultLockTest -e lockScreen true \
            app.clairix.test/androidx.test.runner.AndroidJUnitRunner | tee ../cardvault.txt
          set -e
          "$ADB" logcat -d > ../logcat-cardvault.txt
          # Whatever happened, the emulator is left with no PIN.
          "$ADB" shell locksettings clear --old 1590 >/dev/null 2>&1 || true
          grep "CardVaultLockTest" ../logcat-cardvault.txt || true
          if grep -A1 "FATAL EXCEPTION" ../logcat-cardvault.txt | grep -q "Process: app.clairix"; then
            echo "::error::Clairix crashed during the card-vault lock test; see logcat-cardvault.txt"
            grep -A 30 "FATAL EXCEPTION" ../logcat-cardvault.txt | head -80
            exit 1
          fi
          grep -q "^OK (" ../cardvault.txt || { echo "::error::The card-vault lock test failed; see cardvault.txt"; exit 1; }

      - name: Run the duress passcode test
        working-directory: android
        timeout-minutes: 12
        run: |
          # After everything else: the duress passcode erases the app's data. It
          # also ends the process the app ran in, which is where an instrumentation
          # runs, so the test is three runs (DuressFlowDeviceTest): prepare (inside
          # the app), the duress code typed from outside the app as a person types
          # it (duress-ui.py, which checks the lock screen is still there ten seconds
          # later in a new process), and the decoy (inside the app again, then a
          # relaunch from outside).
          set -o pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          UI="$GITHUB_WORKSPACE/.github/scripts/duress-ui.py"
          DURESS=61849302   # DuressFlowDeviceTest.duress
          "$ADB" logcat -c
          : > ../duress.txt
          step() {
            set +e
            timeout 300 "$ADB" shell am instrument -w -r \
              -e class "app.clairix.security.DuressFlowDeviceTest#$1" -e duress "$1" \
              app.clairix.test/androidx.test.runner.AndroidJUnitRunner > ../duress-$1.txt
            set -e
            cat ../duress-$1.txt >> ../duress.txt
            if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" ../duress-$1.txt; then echo "::error::The duress test's $1 step was skipped"; exit 1; fi
            grep -q "^OK (1 test)" ../duress-$1.txt || { cat ../duress-$1.txt; echo "::error::The duress test's $1 step failed; see duress.txt"; exit 1; }
          }
          check_crash() {
            "$ADB" logcat -d > ../logcat-duress.txt
            if grep -A1 "FATAL EXCEPTION" ../logcat-duress.txt | grep -q "Process: app.clairix"; then
              echo "::error::Clairix crashed during the duress passcode test; see logcat-duress.txt"
              grep -A 30 "FATAL EXCEPTION" ../logcat-duress.txt | head -80
              exit 1
            fi
          }
          step prepare
          python3 "$UI" type-duress "$DURESS" | tee -a ../duress.txt
          check_crash
          step decoy
          python3 "$UI" relaunch "$DURESS" | tee -a ../duress.txt
          check_crash

      - name: Run first run and the Scan hub with permissions refused
        working-directory: android
        timeout-minutes: 45
        run: |
          # Every step above runs on an install made with -g, every permission
          # granted, so no refusal was ever run. Here the app is installed again
          # without -g, and PermissionsDeniedDeviceTest walks onboarding and every
          # Scan category answering each prompt "Don't allow": once with every
          # runtime permission revoked, then once per permission with only that one
          # revoked. Revoking ends the app's process, which is where the test runs,
          # so it is done here with pm revoke before each run. Last, after the
          # duress test: the reinstall starts from nothing.
          set -o pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          PERMS="android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION
                 android.permission.ACCESS_BACKGROUND_LOCATION android.permission.BLUETOOTH_SCAN
                 android.permission.BLUETOOTH_CONNECT android.permission.BLUETOOTH_ADVERTISE
                 android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.POST_NOTIFICATIONS"
          "$ADB" uninstall app.clairix || true
          "$ADB" install -r app/build/outputs/apk/fullSuite/debug/app-full-suite-debug.apk
          : > ../denied.txt
          : > ../logcat-denied.txt
          mkdir -p ../screens/denied
          # pm grant and pm revoke refuse a permission this Android version does not
          # have (POST_NOTIFICATIONS before 13); the test checks each is refused.
          grant() { for p in "$@"; do "$ADB" shell pm grant app.clairix "$p" > /dev/null 2>&1 || true; done; }
          revoke() { for p in "$@"; do "$ADB" shell pm revoke app.clairix "$p" > /dev/null 2>&1 || true; done; }
          walk() {
            "$ADB" logcat -c
            set +e
            timeout 600 "$ADB" shell am instrument -w -r \
              -e class app.clairix.PermissionsDeniedDeviceTest -e permissions denied -e denied "$2" -e label "$1" \
              app.clairix.test/androidx.test.runner.AndroidJUnitRunner > "../denied-$1.txt"
            set -e
            cat "../denied-$1.txt" >> ../denied.txt
            "$ADB" logcat -d > ../logcat-denied-run.txt
            cat ../logcat-denied-run.txt >> ../logcat-denied.txt
            "$ADB" pull /sdcard/Android/data/app.clairix/files/denied ../screens/denied/ > /dev/null 2>&1 || true
            if grep -A1 "FATAL EXCEPTION" ../logcat-denied-run.txt | grep -q "Process: app.clairix"; then
              echo "::error::Clairix crashed with $1 refused; see logcat-denied.txt"
              grep -A 30 "FATAL EXCEPTION" ../logcat-denied-run.txt | head -80
              exit 1
            fi
            if grep -Eq "INSTRUMENTATION_STATUS_CODE: -(3|4)([^0-9]|$)" "../denied-$1.txt"; then echo "::error::The denied-permissions run ($1) was skipped"; exit 1; fi
            grep -q "^OK (1 test)" "../denied-$1.txt" || { cat "../denied-$1.txt"; echo "::error::The app failed with $1 refused; see denied.txt"; exit 1; }
          }
          # shellcheck disable=SC2086
          revoke $PERMS
          # shellcheck disable=SC2086
          walk all "$(echo $PERMS | tr ' ' ',')"
          for p in $PERMS; do
            "$ADB" shell pm clear app.clairix > /dev/null
            # shellcheck disable=SC2086
            grant $PERMS
            revoke "$p"
            walk "${p##*.}" "$p"
          done

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-smoke-api${{ matrix.api }}${{ matrix.image == 'default' && '-aosp' || '' }}
          path: |
            screens/
            instrument.txt
            logcat.txt
            e2e.txt
            logcat-e2e.txt
            relay-toggle.log
            lockscreen.txt
            logcat-lockscreen.txt
            cardvault.txt
            logcat-cardvault.txt
            duress.txt
            logcat-duress.txt
            denied.txt
            denied-*.txt
            logcat-denied.txt
            tor.txt
            logcat-tor.txt
            soak.txt
            logcat-soak.txt
            relaymove.txt
            logcat-relaymove.txt
            relay-a.log
            relay-b.log
            tor-onion.log
            location-after-smoke.txt
            power/
            emulator.log
          if-no-files-found: warn
