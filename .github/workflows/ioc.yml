name: Stalkerware list

# Converts the stalkerware indicators Julien Voisin and Tek maintain for Echap
# (github.com/AssoEchap/stalkerware-indicators, ioc.yaml, CC BY 4.0) into the list the app
# matches installed apps against (tools/ioc/convert.py), signs it with the asset key
# (tools/signing) and publishes it as the `ioc` release: ioc.json.gz and ioc.json.gz.sig.
# Phones fetch it from there, refuse it unless the signature checks, and refuse a list issued
# earlier than the one they have. The copy built into the app is
# android/app/src/suite/assets/ioc.json.gz (convert.py --url ... --out that path).
#
# Two jobs, so the one holding the signing key never installs the YAML parser: `convert`
# fetches and converts without secrets; `publish` checks the result with the standard library
# alone, signs it and publishes it, only when the indicators changed. Pull requests only test
# and convert.
on:
  schedule:
    - cron: '41 5 * * *'
  pull_request:
    paths:
      - 'tools/ioc/**'
      - '.github/workflows/ioc.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ioc/**'
      - '.github/workflows/ioc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ioc
  cancel-in-progress: false

env:
  IOC_URL: https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/ioc.yaml

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the converter's YAML parser and pytest (hash-pinned)
        run: python -m pip install --require-hashes -r tools/ioc/requirements.txt -r tools/requirements-test.txt

      - name: Test the converter
        run: python -m pytest -q tools/ioc

      - name: Fetch and convert
        run: |
          mkdir -p dist
          python tools/ioc/convert.py --url "$IOC_URL" --out dist/ioc.json.gz

      # Only new indicators are published: the same ones under a later "issued" would change
      # nothing on a phone.
      - name: Compare with the published list
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          if gh release download ioc --repo "$GITHUB_REPOSITORY" --pattern ioc.json.gz --dir published 2>/dev/null; then
            set +e
            python tools/ioc/convert.py --same published/ioc.json.gz dist/ioc.json.gz
            same=$?
            set -e
            case "$same" in
              0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
              1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
              *) exit "$same" ;;
            esac
          else
            echo "No published list yet."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ioc
          path: dist/ioc.json.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: convert
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.convert.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ASSET_SIGNING_KEY is a secret of this environment (docs/PROCESS.md).
    environment: assets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the signing tool (hash-pinned)
        run: python -m pip install --require-hashes -r tools/signing/requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ioc
          path: dist

      # The app's rules, with the standard library alone: nothing from the convert job is signed
      # unless it is a well-formed list of plausible size.
      - name: Check the list
        run: python tools/ioc/convert.py --check dist/ioc.json.gz

      - name: Sign
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          python tools/signing/sign.py dist/ioc.json.gz
          python tools/signing/sign.py --verify android/asset-signing.pub dist/ioc.json.gz

      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ioc
          name: Stalkerware list
          body: |
            The stalkerware list Clairix matches installed apps against: the app names, package names and signing-certificate fingerprints from Stalkerware Indicators of Compromise by Julien Voisin and Tek for Echap (https://github.com/AssoEchap/stalkerware-indicators), used under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/), converted by tools/ioc/convert.py.
            ioc.json.gz.sig is its Ed25519 signature by the asset key (android/asset-signing.pub).
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/ioc.json.gz
            dist/ioc.json.gz.sig

  # A red scheduled run is otherwise seen by nobody: this opens one issue, or adds the run to the
  # open one (.github/scripts/report-failure.sh).
  alert:
    needs: [convert, publish]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_TITLE: Stalkerware list publish failing
          FAILURE_MEANS: >-
            No new stalkerware list was published. Phones keep the list built into the app or the last one they
            downloaded, so stalkerware added to the source since then is matched only by its behaviour, not by
            name or certificate, until a run succeeds.
        run: .github/scripts/report-failure.sh
