name: LoRa

# The LoRa radio: the protocol library in lora/core, built and tested on the
# host with its known answers checked by a second, independent model in Python;
# then the firmware for all three boards, built with a pinned PlatformIO. The
# phone's side of the same known answers runs in the Android unit tests.
on:
  pull_request:
    paths:
      - 'lora/**'
      - '.github/workflows/lora.yml'
  push:
    branches: [main]
    paths:
      - 'lora/**'
      - '.github/workflows/lora.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and test the core
        run: |
          cmake -S lora/core -B build/lora -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/lora -j
          ctest --test-dir build/lora --output-on-failure

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # The model's X25519, HKDF and ChaCha20 come from cryptography, the same
      # hash-pinned set the signing tools install.
      - name: Install the model's dependencies
        run: python -m pip install --require-hashes -r tools/signing/requirements.txt

      - name: Check the known answers against the Python model
        run: python lora/core/tests/crosscheck.py lora/core/tests/known_answers.h

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: python -m pip install --require-hashes -r lora/firmware/requirements.txt

      - name: Build every board
        run: pio run -d lora/firmware

      - name: Keep the images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lora-firmware
          path: |
            lora/firmware/.pio/build/*/firmware.bin
            lora/firmware/.pio/build/*/bootloader.bin
            lora/firmware/.pio/build/*/partitions.bin
          retention-days: 14
