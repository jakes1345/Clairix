name: Maps

# Builds the AGR road graph for each region the app offers and publishes it as
# graph-<slug>.agr.gz (+ .sha256) on the release tagged maps-<slug>, replacing the
# previous build. Runs daily so maps track OpenStreetMap edits, whenever the builder
# or the region list changes on master, and on demand for one region or all.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maps.yml'
      - 'tools/graph-builder/**'
  workflow_dispatch:
    inputs:
      region:
        description: 'Geofabrik region path (e.g. north-america/us/ohio), or "all"'
        required: true
        default: 'all'

# Every action is pinned to a commit: this workflow publishes what every
# navigating phone downloads, and it holds the asset signing key.
permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # numpy 2.5 (pinned in requirements.txt) ships wheels for 3.12 and newer only.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/graph-builder/requirements.txt

      - name: Install builder dependencies
        run: python -m pip install -r tools/graph-builder/requirements.txt -r tools/signing/requirements.txt pytest==9.1.1

      - name: Test graph builder and signing tool
        run: python -m pytest -q tools/graph-builder/test_build_graph.py tools/graph-builder/test_extract_cameras.py tools/signing/test_sign.py

      - name: Choose regions
        id: list
        env:
          REGION: ${{ github.event.inputs.region || 'all' }}
        run: |
          if [ "$REGION" = "all" ]; then
            mapfile -t regions < <(grep -v '^\s*$' tools/graph-builder/us-regions.txt)
          else
            regions=("$REGION")
          fi
          for r in "${regions[@]}"; do
            # Matched in bash, not grep: grep tests each line, so a value with a newline would pass.
            if [[ ! "$r" =~ ^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$ ]]; then
              echo "::error::region must look like north-america/us/ohio (got '$r')"
              exit 1
            fi
          done
          json=$(printf '%s\n' "${regions[@]}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "regions=$json" >> "$GITHUB_OUTPUT"
          echo "Building ${#regions[@]} region(s)"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve region
        id: region
        env:
          REGION: ${{ matrix.region }}
        run: |
          slug="${REGION//\//-}"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # numpy 2.5 (pinned in requirements.txt) ships wheels for 3.12 and newer only.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/graph-builder/requirements.txt

      - name: Install builder dependencies
        run: python -m pip install -r tools/graph-builder/requirements.txt -r tools/signing/requirements.txt

      # Geofabrik publishes an MD5 beside every extract. It comes from the same
      # host, so it proves the download is intact rather than authentic; the
      # graph built from it is what gets signed below.
      - name: Download OSM extract
        env:
          REGION: ${{ steps.region.outputs.region }}
        run: |
          url="https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          echo "Downloading $url"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/region.osm.pbf" "$url"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/region.osm.pbf.md5" "$url.md5"
          (cd "$RUNNER_TEMP" && sed 's#  .*#  region.osm.pbf#' region.osm.pbf.md5 | md5sum -c -)
          ls -l "$RUNNER_TEMP/region.osm.pbf"

      # The plate readers (Flock and others) mapped in the same extract, as a small
      # file beside the graph; the app shows them, warns of them and routes around them.
      - name: Extract plate readers
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          mkdir -p dist
          python3 tools/graph-builder/extract_cameras.py "$RUNNER_TEMP/region.osm.pbf" "dist/cameras-$SLUG.json.gz" --region "$SLUG"

      - name: Build graph
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          mkdir -p dist
          # File-backed node index keeps RAM free for the graph arrays on large states.
          python3 tools/graph-builder/build_graph.py "$RUNNER_TEMP/region.osm.pbf" "dist/graph-$SLUG.agr" \
            --region "$SLUG" --index "sparse_file_array,$RUNNER_TEMP/nodes.idx"
          rm -f "$RUNNER_TEMP/nodes.idx" "$RUNNER_TEMP/region.osm.pbf"

      - name: Compress and report
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          agr="dist/graph-$SLUG.agr"
          file="$agr.gz"
          read -r version nodes edges shape <<< "$(od -An -tu4 -j4 -N16 "$agr")"
          raw=$(stat -c %s "$agr")
          gzip -9 -f "$agr"
          (cd dist && sha256sum "graph-$SLUG.agr.gz" > "graph-$SLUG.agr.gz.sha256")
          size=$(stat -c %s "$file")

      # The checksum file is signed with the asset signing key; the app
      # verifies the signature with the public key it was built with, then the
      # graph against the signed checksum. Nothing unsigned is published.
      - name: Sign the checksum
        env:
          SLUG: ${{ steps.region.outputs.slug }}
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          python tools/signing/sign.py "dist/graph-$SLUG.agr.gz.sha256" "dist/cameras-$SLUG.json.gz"
          python tools/signing/sign.py --verify android/asset-signing.pub "dist/graph-$SLUG.agr.gz.sha256" "dist/cameras-$SLUG.json.gz"

      - name: Report
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          agr="dist/graph-$SLUG.agr"
          file="$agr.gz"
          read -r version nodes edges shape <<< "$(zcat "$file" | od -An -tu4 -j4 -N16)"
          raw=$(zcat "$file" | wc -c)
          size=$(stat -c %s "$file")
          echo "AGR version $version: $nodes nodes, $edges edges, $shape shape points"
          echo "uncompressed $raw bytes, compressed $size bytes"
          {
            echo "### Road graph \`$SLUG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Nodes | $nodes |"
            echo "| Edges | $edges |"
            echo "| Shape points | $shape |"
            echo "| Uncompressed | $raw bytes |"
            echo "| graph-$SLUG.agr.gz | $size bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: maps-${{ steps.region.outputs.slug }}
          name: Road graph ${{ steps.region.outputs.region }}
          body: |
            Road graph (format v2) for `${{ steps.region.outputs.region }}`, built from the Geofabrik extract
            by run ${{ github.run_id }} of ${{ github.sha }}, with the plate readers (ALPR) mapped in the same
            extract as cameras-<slug>.json.gz. Rebuilt daily. Map data (c) OpenStreetMap contributors, ODbL.
          files: |
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz.sha256
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz.sha256.sig
            dist/cameras-${{ steps.region.outputs.slug }}.json.gz
            dist/cameras-${{ steps.region.outputs.slug }}.json.gz.sig
          overwrite_files: true
          prerelease: true
          make_latest: false
