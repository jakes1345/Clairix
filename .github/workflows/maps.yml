name: Maps

# Builds the AGR road graph for each region the app offers and publishes it as
# graph-<slug>.agr.gz (+ .sha256) on the release tagged maps-<slug>, replacing the
# previous build. Runs daily so maps track OpenStreetMap edits, whenever the builder
# or the region list changes on main, and on demand for one region or all.
#
# Four jobs, so the asset signing key never shares a job with the builder, its
# dependencies or the downloaded data:
#   plan     tests the builder and the signing tool, and lists the regions
#   build    per region: downloads the extract, builds the graph and the plate-reader
#            list, and hands them on as artifacts; no secrets
#   sign     the one job that reads ASSET_SIGNING_KEY (environment `assets`): installs
#            the hash-pinned signing tool, signs every region's checksum file and
#            plate-reader list, and hands on the signatures alone
#   publish  per region: checks both signatures and the graph against its checksum,
#            as the app does, then publishes the release
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/maps.yml'
      - 'tools/graph-builder/**'
  workflow_dispatch:
    inputs:
      region:
        description: 'Geofabrik region path (e.g. north-america/us/ohio), or "all"'
        required: true
        default: 'all'

# Every action is pinned to a commit: this workflow publishes what every
# navigating phone downloads, and it holds the asset signing key. Read-only by
# default: only publish can write releases.
permissions:
  contents: read

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # numpy 2.5 (pinned in requirements.txt) ships wheels for 3.12 and newer only.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/graph-builder/requirements.txt
            tools/signing/requirements.txt
            tools/requirements-test.txt

      # Hash-pinned: pip refuses any file whose hash the requirements files do not list.
      - name: Install builder dependencies
        run: python -m pip install --require-hashes -r tools/graph-builder/requirements.txt -r tools/signing/requirements.txt -r tools/requirements-test.txt

      - name: Test graph builder and signing tool
        run: python -m pytest -q tools/graph-builder/test_build_graph.py tools/graph-builder/test_extract_cameras.py tools/graph-builder/test_extract_info.py tools/signing/test_sign.py

      - name: Choose regions
        id: list
        env:
          REGION: ${{ github.event.inputs.region || 'all' }}
        run: |
          if [ "$REGION" = "all" ]; then
            mapfile -t regions < <(grep -v '^\s*$' tools/graph-builder/us-regions.txt)
          else
            regions=("$REGION")
          fi
          for r in "${regions[@]}"; do
            # Matched in bash, not grep: grep tests each line, so a value with a newline would pass.
            if [[ ! "$r" =~ ^[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*)*$ ]]; then
              echo "::error::region must look like north-america/us/ohio (got '$r')"
              exit 1
            fi
          done
          json=$(printf '%s\n' "${regions[@]}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "regions=$json" >> "$GITHUB_OUTPUT"
          echo "Building ${#regions[@]} region(s)"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve region
        id: region
        env:
          REGION: ${{ matrix.region }}
        run: |
          slug="${REGION//\//-}"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # numpy 2.5 (pinned in requirements.txt) ships wheels for 3.12 and newer only.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/graph-builder/requirements.txt

      # Hash-pinned, as in plan.
      - name: Install builder dependencies
        run: python -m pip install --require-hashes -r tools/graph-builder/requirements.txt

      # Geofabrik publishes an MD5 beside every extract. It comes from the same
      # host, so it proves the download is intact rather than authentic; the
      # graph built from it is what gets signed below. The MD5, the time the
      # extract was published and the time its data was cut go into the release
      # notes (tools/graph-builder/extract_info.py), so a published graph can be
      # matched to the extract it was built from.
      - name: Download OSM extract
        env:
          REGION: ${{ steps.region.outputs.region }}
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          url="https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          echo "Downloading $url"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -D "$RUNNER_TEMP/region.headers" -o "$RUNNER_TEMP/region.osm.pbf" "$url"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/region.osm.pbf.md5" "$url.md5"
          (cd "$RUNNER_TEMP" && sed 's#  .*#  region.osm.pbf#' region.osm.pbf.md5 | md5sum -c -)
          ls -l "$RUNNER_TEMP/region.osm.pbf"
          mkdir -p dist
          python3 tools/graph-builder/extract_info.py record --pbf "$RUNNER_TEMP/region.osm.pbf" \
            --md5 "$RUNNER_TEMP/region.osm.pbf.md5" --headers "$RUNNER_TEMP/region.headers" \
            --url "$url" --region "$REGION" --out "dist/source-$SLUG.json"

      # The plate readers (Flock and others) mapped in the same extract, as a small
      # file beside the graph; the app shows them, warns of them and routes around them.
      - name: Extract plate readers
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          mkdir -p dist
          python3 tools/graph-builder/extract_cameras.py "$RUNNER_TEMP/region.osm.pbf" "dist/cameras-$SLUG.json.gz" --region "$SLUG"

      - name: Build graph
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          mkdir -p dist
          # File-backed node index keeps RAM free for the graph arrays on large states.
          python3 tools/graph-builder/build_graph.py "$RUNNER_TEMP/region.osm.pbf" "dist/graph-$SLUG.agr" \
            --region "$SLUG" --index "sparse_file_array,$RUNNER_TEMP/nodes.idx"
          rm -f "$RUNNER_TEMP/nodes.idx" "$RUNNER_TEMP/region.osm.pbf"

      - name: Compress and report
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          agr="dist/graph-$SLUG.agr"
          file="$agr.gz"
          read -r version nodes edges shape <<< "$(od -An -tu4 -j4 -N16 "$agr")"
          raw=$(stat -c %s "$agr")
          gzip -9 -f "$agr"
          (cd dist && sha256sum "graph-$SLUG.agr.gz" > "graph-$SLUG.agr.gz.sha256")
          size=$(stat -c %s "$file")

      - name: Report
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          agr="dist/graph-$SLUG.agr"
          file="$agr.gz"
          read -r version nodes edges shape <<< "$(zcat "$file" | od -An -tu4 -j4 -N16)"
          raw=$(zcat "$file" | wc -c)
          size=$(stat -c %s "$file")
          echo "AGR version $version: $nodes nodes, $edges edges, $shape shape points"
          echo "uncompressed $raw bytes, compressed $size bytes"
          {
            echo "### Road graph \`$SLUG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Nodes | $nodes |"
            echo "| Edges | $edges |"
            echo "| Shape points | $shape |"
            echo "| Uncompressed | $raw bytes |"
            echo "| graph-$SLUG.agr.gz | $size bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The graph itself goes straight to publish; sign gets only what is signed
      # (the graph's checksum file and the plate-reader list) and the extract's record.
      - name: Keep the graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-${{ steps.region.outputs.slug }}
          path: dist/graph-${{ steps.region.outputs.slug }}.agr.gz
          if-no-files-found: error
          retention-days: 3

      - name: Keep what is signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tosign-${{ steps.region.outputs.slug }}
          path: |
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz.sha256
            dist/cameras-${{ steps.region.outputs.slug }}.json.gz
            dist/source-${{ steps.region.outputs.slug }}.json
          if-no-files-found: error
          retention-days: 3

  # The checksum file is signed with the asset signing key; the app verifies the
  # signature with the public key it was built with, then the graph against the
  # signed checksum. Nothing unsigned is published. Every region that built is
  # signed, so one region failing does not hold the others back.
  sign:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: assets
    outputs:
      regions: ${{ steps.sign.outputs.regions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/signing
            android/asset-signing.pub
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the signing tool (hash-pinned)
        run: python -m pip install --require-hashes -r tools/signing/requirements.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tosign-*
          path: dist
          merge-multiple: true

      - name: Sign
        id: sign
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          shopt -s nullglob
          files=(dist/graph-*.agr.gz.sha256 dist/cameras-*.json.gz)
          if [ "${#files[@]}" = 0 ]; then
            echo "::error::No region was built, so there is nothing to sign"
            exit 1
          fi
          python tools/signing/sign.py "${files[@]}"
          python tools/signing/sign.py --verify android/asset-signing.pub "${files[@]}"
          regions=$(python3 -c 'import glob, json; print(json.dumps(sorted(json.load(open(p))["region"] for p in glob.glob("dist/source-*.json"))))')
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Signed: $regions"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: dist/*.sig
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: sign
    if: ${{ !cancelled() && needs.sign.result == 'success' && needs.sign.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.sign.outputs.regions) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/graph-builder/extract_info.py
            android/asset-signing.pem
          sparse-checkout-cone-mode: false

      - name: Resolve region
        id: region
        env:
          REGION: ${{ matrix.region }}
        run: |
          slug="${REGION//\//-}"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: graph-${{ steps.region.outputs.slug }}
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tosign-${{ steps.region.outputs.slug }}
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signatures
          path: dist

      # What the app checks before it uses a map, checked here before anything is
      # published: each signature against the key the app is built with (as the
      # release notes tell anyone to check SHA256SUMS.txt), then the graph against
      # the signed checksum.
      - name: Check the signatures and the checksum
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          cd dist
          for f in "graph-$SLUG.agr.gz.sha256" "cameras-$SLUG.json.gz"; do
            sed 's/$/==/' "$f.sig" | base64 -d > "$RUNNER_TEMP/file.sig"
            openssl pkeyutl -verify -pubin -inkey ../android/asset-signing.pem -rawin -in "$f" -sigfile "$RUNNER_TEMP/file.sig"
          done
          sha256sum -c "graph-$SLUG.agr.gz.sha256"

      - name: Compose the release notes
        env:
          SLUG: ${{ steps.region.outputs.slug }}
        run: |
          python3 tools/graph-builder/extract_info.py notes "dist/source-$SLUG.json" \
            --slug "$SLUG" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: maps-${{ steps.region.outputs.slug }}
          name: Road graph ${{ steps.region.outputs.region }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz.sha256
            dist/graph-${{ steps.region.outputs.slug }}.agr.gz.sha256.sig
            dist/cameras-${{ steps.region.outputs.slug }}.json.gz
            dist/cameras-${{ steps.region.outputs.slug }}.json.gz.sig
          overwrite_files: true
          prerelease: true
          make_latest: false

  # A red daily run is otherwise seen by nobody: one issue for the run (not one per
  # region), or a comment on the open one (.github/scripts/report-failure.sh).
  alert:
    needs: [plan, build, sign, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_TITLE: Maps publish failing
          FAILURE_MEANS: >-
            At least one region's road graph or plate-reader list was not rebuilt and published
            (the run's job list says which). Phones keep that region's last published files.
        run: .github/scripts/report-failure.sh
