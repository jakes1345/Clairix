name: Relay

# Type-checks the comms relay Worker and runs its tests end to end: the
# Worker's own fetch handler and Durable Objects over in-memory storage
# (test/harness/fake-env.mjs), including mixing and relay-to-relay federation.
on:
  pull_request:
    paths:
      - 'comms-worker/**'
      - '.github/workflows/relay.yml'
  push:
    branches: [main]
    paths:
      - 'comms-worker/**'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: comms-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 22.18+ runs the TypeScript sources directly and has node:sqlite.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      - name: Install
        run: npm ci --no-audit --no-fund

      # src/voprf.wasm (the relay's half of the blind send tokens) is committed
      # so the Worker deploys without Rust. Its own tests run here, and it is
      # rebuilt with the pinned compiler: the job fails if the committed bytes
      # are not what voprf/ makes.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown

      - name: Test the token module
        working-directory: comms-worker/voprf
        run: cargo test --locked --release

      - name: Check src/voprf.wasm is what voprf/ builds
        run: sh scripts/build-voprf.sh --check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle
        run: npx wrangler deploy --dry-run --outdir=dist

      # The self-hosted relay (selfhost/): the same bundle under plain
      # workerd, Durable Objects on disk, settings from the environment, and
      # the cron worker that stands in for Cloudflare's scheduler.
      - name: Run the self-hosted build under workerd
        run: |
          state="$RUNNER_TEMP/selfhost-state"
          mkdir -p "$state"
          node selfhost/build.mjs --out "$RUNNER_TEMP/selfhost" --state "$state"
          ENROLL_SECRET=selfhost-check-secret-0123456789 \
            node_modules/.bin/workerd serve --experimental "$RUNNER_TEMP/selfhost/relay.capnp" > "$RUNNER_TEMP/workerd.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/ | grep -q '"service":"clairix-comms"' || { cat "$RUNNER_TEMP/workerd.log"; exit 1; }
          test "$(curl -sf -X POST http://127.0.0.1:8789/)" = ok || { cat "$RUNNER_TEMP/workerd.log"; exit 1; }
          test -d "$state/clairix-relay-Mailbox" || { echo "::error::no Durable Object storage on disk"; exit 1; }
          bash -n selfhost/install.sh
