name: Release

# Three ways to cut a release, all producing the same signed artifacts and
# GitHub Release:
#   - push a tag            v3.0.0-beta.1
#   - push a branch         release/v3.0.0-beta.1   (the tag is created at its head)
#   - Actions → Run workflow with the tag as input
# The branch form exists for environments that can push branches but not tags.
#
# What a release carries:
#   clairix-<tag>.apk          full edition, whole app   (fullSuiteRelease)
#   clairix-comms-<tag>.apk    full edition, comms only  (fullCommsRelease)
#   clairix-play-<tag>.aab     Play edition bundle for the Play Console (playSuiteRelease)
#   SHA256SUMS.txt             SHA-256 of each of the three
#
# A tag with a pre-release suffix (v3.0.0-beta.1, -alpha.N, -rc.N) is published
# as a GitHub pre-release; a plain vX.Y.Z is a normal release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0-beta.1)'
        required: true
        default: 'v3.0.0-beta.5'

# Every action is pinned to a commit: this job holds the release signing key
# and a token that can publish, so a moved tag would be a trojaned release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A manual run may start from main, a release branch or a tag, and from
      # nowhere else: the signing key must not sign whatever any branch holds.
      - name: Check where a manual run starts from
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/release/v*|refs/tags/v*) echo "Releasing from $REF" ;;
            *) echo "::error::A release can be started by hand only from main, a release/v* branch or a v* tag, not $REF"; exit 1 ;;
          esac

      - name: Resolve tag name
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            NAME="$INPUT_TAG"
          elif [ "$REF_TYPE" = "branch" ]; then
            NAME="${REF_NAME#release/}"
          else
            NAME="$REF_NAME"
          fi
          case "$NAME" in
            v[0-9]*) ;;
            *) echo "::error::'$NAME' is not a release tag (expected vX.Y.Z or vX.Y.Z-beta.N)"; exit 1 ;;
          esac
          case "$NAME" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          # The tag has to name the version the app is built as, or the APK and
          # the release page disagree about what was shipped.
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/app/build.gradle.kts | head -1)
          if [ "v$VERSION_NAME" != "$NAME" ]; then
            echo "::error::Tag $NAME does not match versionName $VERSION_NAME in android/app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME from $GITHUB_SHA (pre-release: $PRERELEASE)"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; the pinned NDK is installed below.
      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # The same version comms-crypto/rust-toolchain.toml names, so the
          # crate is built with one compiler everywhere; bump both together.
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      # The wrapper jar is checked against Gradle's published checksums and
      # the build goes through the wrapper, as in android.yml.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install the asset signing tool
        run: python -m pip install -r tools/signing/requirements.txt

      # Android refuses to install an update whose signing certificate differs from
      # the one already on the device. This step used to run `keytool -genkey` on
      # every release, which mints a brand new keypair each time — so every release
      # was signed by a different certificate and could only be installed by
      # uninstalling the previous build first, taking the cell baseline, the event
      # log and the trusted-device list with it.
      #
      # With the ANDROID_KEYSTORE_BASE64 secret set, every release is signed by the
      # same key and installs straight over the last one. Without it we fall back to
      # the old throwaway key so the build still produces something installable, and
      # the release notes say plainly that it needs a clean install. The keystore
      # is written under the runner's temp directory, outside the checkout, and is
      # gone when the job ends.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the persistent release key."
          else
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so these builds are signed with a throwaway key: the APKs cannot be installed over an earlier release, and the AAB must not be uploaded to Google Play."
          fi

      # Gradle signs the release builds itself from these four variables (see
      # signingConfigs in android/app/build.gradle.kts). The passwords come from
      # secrets and are never written to disk or to $GITHUB_ENV. The fallbacks
      # are the throwaway key's.
      - name: Build signed release APKs and the Play bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew assembleFullSuiteRelease assembleFullCommsRelease bundlePlaySuiteRelease \
            --no-daemon --stacktrace

      # The Play edition must not declare card emulation. This reads every
      # manifest Gradle merged for the Play bundle and stops the release if a
      # HostApduService or the card-emulation service ever finds its way back in.
      # The full edition's manifest is checked the other way round, so a change
      # in where Gradle writes manifests cannot make this pass by finding nothing.
      - name: Check the Play edition has no card emulation
        run: |
          HCE='HOST_APDU_SERVICE|host_apdu_service|CardEmulationService|BIND_NFC_SERVICE'
          PLAY=$(find android/app/build/intermediates -path '*playSuiteRelease*' -name AndroidManifest.xml | grep -E 'merged_manifest|bundle_manifest' || true)
          FULL=$(find android/app/build/intermediates -path '*fullSuiteRelease*' -name AndroidManifest.xml | grep -E 'merged_manifest' | head -1)
          if [ -z "$PLAY" ] || [ -z "$FULL" ]; then
            echo "::error::Merged manifests for playSuiteRelease / fullSuiteRelease not found"; exit 1
          fi
          if ! grep -Eq "$HCE" "$FULL"; then
            echo "::error::The full edition's manifest has no card-emulation service; the check below would prove nothing"; exit 1
          fi
          for m in $PLAY; do
            echo "Checking $m"
            if grep -Eq "$HCE" "$m"; then
              echo "::error file=$m::The Play edition declares card emulation"; exit 1
            fi
          done
          echo "No card emulation in the Play edition."

      - name: Collect and verify artifacts
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          OUT=android/app/build/outputs/release-files
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/fullSuite/release/app-full-suite-release.apk "$OUT/clairix-${TAG}.apk"
          cp android/app/build/outputs/apk/fullComms/release/app-full-comms-release.apk "$OUT/clairix-comms-${TAG}.apk"
          cp android/app/build/outputs/bundle/playSuiteRelease/app-play-suite-release.aab "$OUT/clairix-play-${TAG}.aab"
          # The certificate digest is what decides whether a phone will accept an
          # APK as an update to the installed build, so print it: two releases that
          # share this value will install over each other, and two that do not
          # never will, whatever their version numbers say.
          for apk in "$OUT"/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done
          # The bundle is jar-signed; Play checks it against the registered upload key.
          keytool -printcert -jarfile "$OUT/clairix-play-${TAG}.aab"
          (cd "$OUT" && sha256sum "clairix-${TAG}.apk" "clairix-comms-${TAG}.apk" "clairix-play-${TAG}.aab" > SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"

      # The checksum file is signed with the asset signing key (tools/signing),
      # whose public half is committed as android/asset-signing.pem, so a
      # swapped release cannot come with matching checksums. The app's own
      # map and work-zone downloads are checked against the same key.
      - name: Sign the checksums
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          OUT=android/app/build/outputs/release-files
          python tools/signing/sign.py "$OUT/SHA256SUMS.txt"
          python tools/signing/sign.py --verify android/asset-signing.pub "$OUT/SHA256SUMS.txt"

      - name: Compose release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
          STABLE: ${{ steps.signing.outputs.stable }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          # "3.0.0-beta.1" reads as "3.0.0 Beta 1" on the release page.
          PRETTY=$(printf '%s' "$VERSION" | sed -E 's/-beta\.?([0-9]+)$/ Beta \1/; s/-alpha\.?([0-9]+)$/ Alpha \1/; s/-rc\.?([0-9]+)$/ Release Candidate \1/')
          OUT=android/app/build/outputs/release-files
          {
            echo "## Clairix ${PRETTY}"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "This is a **beta**: a public test of Clairix 3.0. It is meant for people"
              echo "who are happy to try new things and tell us what breaks. Keep your current"
              echo "version if you rely on Clairix every day and don't want surprises."
              echo
            fi
            echo "### What's new in Beta 5: relays that reach each other, and checks on GPS, 2G and your keyboard"
            echo
            echo "- **Contacts on other relays.** Anyone can run a Clairix relay, and a contact on"
            echo "  another one is added by scanning their QR code. Your relay forwards to theirs,"
            echo "  signed with its own key: their relay sees your relay's address, never your"
            echo "  phone's, and nothing it receives names you. The contact's page says which relay"
            echo "  they are on. Both of you need Beta 5."
            echo "- **Mixing.** The relay holds each message a random few seconds (about four on"
            echo "  average, never more than twenty) and releases everything due together, shuffled,"
            echo "  so timing alone does not pair a message in with a delivery out. Calls being set"
            echo "  up, SOS alerts and group changes are never held."
            echo "- **Offline mesh** (off by default). Texts, group texts and SOS that cannot reach the"
            echo "  relay are passed phone to phone over Bluetooth in the same sealed envelopes,"
            echo "  addressed by a tag that changes daily, for at most two days and eight hops."
            echo "- **GPS spoofing and jamming checks.** Satellite signal strengths, satellite time"
            echo "  against network time, GPS against Wi-Fi and cell position, impossible jumps,"
            echo "  mock-location apps and the receiver's own gain control. Navigation warns over the"
            echo "  map when the signal is spoofed or jammed."
            echo "- **2G and VPN leaks** in Phone check: whether the phone has the \"Allow 2G\" switch"
            echo "  (and a red row if it is ever seen on a 2G tower), DNS or IPv6 leaking past the VPN,"
            echo "  Clairix left outside it, and \"Block connections without VPN\" turned off."
            echo "- **Ultrasonic beacons.** Listens on demand for the inaudible tones advertising kits"
            echo "  use to tie a phone to a place or a programme, after first checking the microphone"
            echo "  can hear that band. Nothing is recorded."
            echo "- **Your keyboard.** Clairix asks the keyboard not to learn from anything typed in"
            echo "  it, and Phone check names the keyboard in use and warns if it can reach the internet."
            echo "- **A tour of the app** after setup, covering every page with a button to open it;"
            echo "  take it again from Settings. Onboarding now explains why Android asks whether"
            echo "  Clairix may suggest Wi-Fi networks."
            echo "- **Security fixes from our own review:** a way to learn whether any number existed,"
            echo "  a way for another relay to fill someone's mailbox, and group messages that"
            echo "  recognised members by number alone. Members are now matched by their keys."
            echo "- The COMMS database is upgraded once, on first start, to record each contact's relay."
            echo
            echo "### What was new in Beta 4: what your Bluetooth gives away, and plate readers for real"
            echo
            echo "- **Bluetooth exposure** (Scan → Trackers). What a receiver by the road or in a"
            echo "  shop can log from this phone: its name, replaced with the model name in one tap"
            echo "  if it reads like yours; whether it is discoverable (and an alert if it stays"
            echo "  so); every paired accessory with whether its address is fixed for life or"
            echo "  rotates, which are connected now, and which rode along on your drives. The"
            echo "  phone's own advertising address rotates; a car's hands-free and most earbuds"
            echo "  do not, and the page says which of yours is the one being logged."
            echo "- **Surveillance hardware heard over radio.** A Flock Safety camera's battery"
            echo "  pack, a Raven gunshot detector or a Flock setup hotspot is recognised by the"
            echo "  signatures the DeFlock and flock-you projects published, compared with the"
            echo "  plate readers on your map (\"matches the reader mapped 80 m away\" or \"not on"
            echo "  the map yet\") and written to the timeline with your position. A certain match"
            echo "  notifies (Settings → Scanning). Flock has been turning these radios down since"
            echo "  2025, so hearing nothing next to a camera is normal; the map is the better guide."
            echo "- **The plate-reader lists are now published.** Beta 3 shipped the map layer, but"
            echo "  the daily map build had been failing since 22 October and no list ever went"
            echo "  out. Fixed; every region's release now carries its signed camera list, and the"
            echo "  app downloads it with the map."
            echo
            echo "### What was new in Beta 3: built for a seized phone and a watched network"
            echo
            echo "- **Everything at rest is sealed.** The location log, timeline, cell baseline,"
            echo "  trips, unlock ledger and comms log are encrypted under a key in the phone's"
            echo "  Keystore; the COMMS database runs under SQLCipher. Files from earlier versions"
            echo "  are converted once, on first start."
            echo "- **History is kept 30 days by default** (7, 90 or forever in Settings → Data):"
            echo "  what was deleted cannot be taken from the phone."
            echo "- **App lock that means it.** Wrong passcodes wipe (3 by default), a duress"
            echo "  passcode wipes silently, \"Wipe Clairix\" wipes on demand, and a locked app"
            echo "  shows \"Unlock to read\" in place of every notification."
            echo "- **The relay keeps less.** No activity times, no last-seen, sends spent through"
            echo "  anonymous tokens, allowances kept only to the hour; an optional TLS pin on the"
            echo "  relay's key; optional cover traffic and relay-only calls; alternate relay"
            echo "  addresses with failover."
            echo "- **Navigation searches on the phone.** Destinations are found in the downloaded"
            echo "  map's road names; the online search is a separate, labelled choice."
            echo "- **Signed releases.** \`SHA256SUMS.txt.sig\` is the checksum list signed with"
            echo "  the project key, maps and work zones are signed the same way, and every"
            echo "  change is built twice on two machines in CI and must come out the same."
            echo "- **Smaller download.** Native libraries are stripped; earlier builds shipped"
            echo "  them with debug information."
            echo "- **Known plate readers.** Flock Safety and other licence-plate cameras mapped"
            echo "  in OpenStreetMap are shown on the map, spoken 600 m before you reach one,"
            echo "  counted on every route and routed around by default (Drive → route options)."
            echo "  Only what has been mapped: an unmapped camera is not avoided."
            echo
            echo "### What was new in Beta 2: stronger COMMS"
            echo
            echo "- **The relay no longer learns who is writing to whom.** Messages are delivered"
            echo "  with single-use anonymous tokens instead of your number, and the sender's"
            echo "  identity travels signed inside the encrypted message."
            echo "- **Message lengths are hidden.** Every message is padded up to one of a few"
            echo "  set sizes before it is encrypted, so short messages all look the same."
            echo "- **Key changes are held for you.** If a contact's security key changes, their"
            echo "  messages wait in a review box until you verify, accept or discard them."
            echo "- **Screenshots and screen recording are blocked** on COMMS screens."
            echo "- **Secret keys are wiped from memory** by the encryption library as soon as"
            echo "  they are no longer needed."
            echo
            echo "### What's new in 3.0"
            echo
            echo "- **A new look.** Every screen has been redesigned: clearer status at the top of"
            echo "  each tab, bigger touch targets, and a choice of dark colour themes in"
            echo "  Settings → Appearance."
            echo "- **Two editions.** Clairix now comes in a Google Play edition and a Full edition"
            echo "  (this download). They are the same app, except that the Play edition leaves out"
            echo "  the Card Vault with card emulation and ClairixCoin."
            echo "- **Fixes** across the app, including the colour theme when an incoming call"
            echo "  starts Clairix and clearer wording on the certificate-pinning check."
            echo
            echo "### Which file do I want?"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`clairix-${TAG}.apk\` | **The Full edition.** The whole app, including the Card Vault and ClairixCoin. Most people want this one. |"
            echo "| \`clairix-comms-${TAG}.apk\` | **Clairix Comms.** Only the encrypted messages, calls, groups and SOS: no scanner, no tools and none of their permissions. For people you want to be able to reach but not hand the full toolkit. Installing the Full edition over it later keeps the number, contacts and messages. |"
            echo "| \`clairix-play-${TAG}.aab\` | The Google Play bundle. Phones can't install this file directly; it is here for the Play Console. |"
            echo "| \`SHA256SUMS.txt\` | Checksums to confirm your download is intact. |"
            echo "| \`SHA256SUMS.txt.sig\` | Signature over the checksums by the Clairix asset signing key, so a swapped release cannot come with matching checksums. |"
            echo
            echo "### What Clairix does"
            echo
            echo "Clairix is a defensive security monitor for Android. It finds Bluetooth tracker"
            echo "tags that travel with you, Wi-Fi bait networks and signs of fake cell towers, and"
            echo "checks NFC cards and tags for skimmers. Detection data stays on your phone. The"
            echo "Map tab downloads OpenStreetMap tiles, which shows the tile server your IP address"
            echo "and the area you are looking at."
            echo
            echo "**COMMS** is end-to-end encrypted messaging and calling between Clairix apps. Your"
            echo "relay passes messages along but can read neither what they say nor who sent them."
            echo "A Clairix number is not a phone number: it only reaches other Clairix apps on the"
            echo "same relay. You (or someone you trust) set up the relay in \`comms-worker/\` once;"
            echo "everyone else joins by invite from COMMS → INVITE."
            echo
            echo "### Install"
            echo
            if [ "$STABLE" = "true" ]; then
              echo "1. Download \`clairix-${TAG}.apk\` below and tap it."
              echo "2. It installs straight over an earlier Clairix release and keeps your baseline, event log and trusted devices."
              echo "3. First install only: Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            else
              echo "> [!WARNING]"
              echo "> This build is signed with a throwaway key, so Android will refuse to install it"
              echo "> over an earlier release. You have to uninstall the old version first, which"
              echo "> clears the cell baseline, the event log and the trusted-device list."
              echo
              echo "1. Uninstall any existing Clairix."
              echo "2. Download \`clairix-${TAG}.apk\` below and tap it."
              echo "3. Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            fi
            echo
            echo "**Requirements:** Android 12 or newer."
            echo
            echo "### Check your download"
            echo
            echo "On a computer, put what you downloaded in one folder with \`SHA256SUMS.txt\` and run"
            echo "\`sha256sum -c --ignore-missing SHA256SUMS.txt\` (on a Mac:"
            echo "\`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\`). Each file should say OK."
            echo
            echo "To check that the checksums themselves came from the Clairix release key, fetch"
            echo "[\`android/asset-signing.pem\`](https://github.com/jakes1345/Clairix/blob/main/android/asset-signing.pem)"
            echo "from the repository and run (the signature is base64 without its trailing"
            echo "padding, which the first line puts back):"
            echo
            echo '```'
            echo "sed 's/\$/==/' SHA256SUMS.txt.sig | base64 -d > sums.sig"
            echo "openssl pkeyutl -verify -pubin -inkey asset-signing.pem -rawin -in SHA256SUMS.txt -sigfile sums.sig"
            echo '```'
            echo
            echo '```'
            cat "$OUT/SHA256SUMS.txt"
            echo '```'
            if [ "$PRERELEASE" = "true" ]; then
              echo
              echo "### Found a problem?"
              echo
              echo "Open an issue on GitHub and say which file you installed, your phone model and"
              echo "Android version, and what you did just before it went wrong."
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Clairix ${{ steps.tag.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            android/app/build/outputs/release-files/clairix-${{ steps.tag.outputs.name }}.apk
            android/app/build/outputs/release-files/clairix-comms-${{ steps.tag.outputs.name }}.apk
            android/app/build/outputs/release-files/clairix-play-${{ steps.tag.outputs.name }}.aab
            android/app/build/outputs/release-files/SHA256SUMS.txt
            android/app/build/outputs/release-files/SHA256SUMS.txt.sig
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
