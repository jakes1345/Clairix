name: Release

# Three ways to cut a release, all producing the same signed artifacts and
# GitHub Release:
#   - push a tag            v3.0.0-beta.1
#   - push a branch         release/v3.0.0-beta.1   (the tag is created at its head)
#   - Actions → Run workflow with the tag as input
# The branch form exists for environments that can push branches but not tags.
#
# What a release carries:
#   clairix-<tag>.apk                 full edition, whole app   (fullSuiteRelease)
#   clairix-comms-<tag>.apk           full edition, comms only  (fullCommsRelease)
#   clairix-foss-<tag>.apk            foss edition, whole app   (fossSuiteRelease): no Google Play
#                                     services or Firebase; for F-Droid to check its own build against
#   clairix-play-<tag>.aab            Play edition bundle for the Play Console (playSuiteRelease)
#   sbom-android-<tag>.cdx.json       CycloneDX bill of materials: the Java and Kotlin libraries
#   sbom-comms-crypto-<tag>.cdx.json  CycloneDX bill of materials: the Rust crates in the crypto library
#   SHA256SUMS.txt                    SHA-256 of each of the six
#
# Nothing is signed until the Android APK workflow has passed on the commit
# (job checks), an Emulator smoke test run has passed on the same tree (job
# emulator) and the bills of materials are made (job sbom). The signing keys
# are secrets of the `release` environment, read by the release job alone
# (docs/PROCESS.md).
#
# A tag with a pre-release suffix (v3.0.0-beta.1, -alpha.N, -rc.N) is published
# as a GitHub pre-release; a plain vX.Y.Z is a normal release.
on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0-beta.1)'
        required: true
        default: 'v3.0.0-beta.9'
      allow_throwaway_key:
        description: 'Build without ANDROID_KEYSTORE_BASE64, signing with a throwaway key. The files are kept as a workflow artifact only; no GitHub release is published.'
        type: boolean
        required: false
        default: false

# Every action is pinned to a commit: the release job holds the release signing
# key and a token that can publish, so a moved tag would be a trojaned release.
# Read-only by default; the release job alone can write.
permissions:
  contents: read

jobs:
  # The whole Android APK workflow on this commit: the crypto crate's tests,
  # the Kotlin unit tests, the screenshots, lint, detekt and the build on two
  # machines that must come out the same. No secrets are passed to it.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml

  # The emulator suite takes hours on four Android versions, so it is not run
  # a second time here. This job requires a run of it, started by a push or by
  # hand, that passed on a commit where the app, the crate, the relay and the
  # relay list are the same as on this one, and waits for such a run that is
  # still going (.github/scripts/wait_for_runs.py). With none, it fails and
  # says how to start one. A throwaway-key run publishes nothing and skips it.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a passing emulator run on this tree
        if: inputs.allow_throwaway_key != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/wait_for_runs.py covered --sha "$GITHUB_SHA" --workflow emulator.yml \
            --paths android comms-crypto comms-worker relays .github/workflows/emulator.yml --wait-minutes 225

  # CycloneDX bills of materials: the libraries in the app (Gradle) and the
  # Rust crates in its crypto library (cargo-cyclonedx). Made in a job that
  # holds no secrets; the release job attaches them and lists them in
  # SHA256SUMS.txt, so the signature covers them too.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      # The crates in libclairix_comms_crypto.so, resolved for arm64 Android
      # (the 32-bit ARM and x86_64 libraries are built from the same
      # Cargo.lock), leaving out what only build scripts use.
      - name: Bill of materials of the crypto crate
        run: |
          cargo cyclonedx --manifest-path comms-crypto/Cargo.toml --format json --spec-version 1.5 \
            --target aarch64-linux-android --no-build-deps --override-filename comms-crypto.cdx
          mkdir -p sbom
          mv comms-crypto/comms-crypto.cdx.json sbom/

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Resolves the release classpath; nothing is compiled.
      - name: Bill of materials of the app's libraries
        working-directory: android
        run: |
          ./gradlew :app:cyclonedxDirectBom --no-daemon --stacktrace
          cp app/build/reports/cyclonedx/clairix-android.cdx.json ../sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [checks, emulator, sbom]
    runs-on: ubuntu-latest
    # The release signing key, its passwords and the asset signing key are
    # secrets of this environment (docs/PROCESS.md): no other job can read
    # them, and only on the refs the environment allows.
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      stable: ${{ steps.signing.outputs.stable }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A manual run may start from main, a release branch or a tag, and from
      # nowhere else: the signing key must not sign whatever any branch holds.
      - name: Check where a manual run starts from
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/release/v*|refs/tags/v*) echo "Releasing from $REF" ;;
            *) echo "::error::A release can be started by hand only from main, a release/v* branch or a v* tag, not $REF"; exit 1 ;;
          esac

      - name: Resolve tag name
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            NAME="$INPUT_TAG"
          elif [ "$REF_TYPE" = "branch" ]; then
            NAME="${REF_NAME#release/}"
          else
            NAME="$REF_NAME"
          fi
          case "$NAME" in
            v[0-9]*) ;;
            *) echo "::error::'$NAME' is not a release tag (expected vX.Y.Z or vX.Y.Z-beta.N)"; exit 1 ;;
          esac
          case "$NAME" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          # The tag has to name the version the app is built as, or the APK and
          # the release page disagree about what was shipped.
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/app/build.gradle.kts | head -1)
          if [ "v$VERSION_NAME" != "$NAME" ]; then
            echo "::error::Tag $NAME does not match versionName $VERSION_NAME in android/app/build.gradle.kts"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME from $GITHUB_SHA (pre-release: $PRERELEASE)"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; the pinned NDK is installed below.
      # The COMMS crypto crate (comms-crypto/) is Rust, cross-compiled for Android
      # by Gradle through cargo-ndk, with its Kotlin binding generated by UniFFI.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          # The same version comms-crypto/rust-toolchain.toml names, so the
          # crate is built with one compiler everywhere; bump both together.
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: comms-crypto

      # The NDK and cargo-ndk versions android/app/build.gradle.kts pins; the
      # build refuses any other, so a release can be rebuilt with the same tools.
      - name: Install the pinned NDK, the API 36 platform and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      # The wrapper jar is checked against Gradle's published checksums and
      # the build goes through the wrapper, as in android.yml.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test the crypto crate
        working-directory: comms-crypto
        run: cargo test --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # Hash-pinned: pip refuses any file whose hash tools/signing/requirements.txt does not list.
      - name: Install the asset signing tool
        run: python -m pip install --require-hashes -r tools/signing/requirements.txt

      # Android refuses to install an update whose signing certificate differs from
      # the one already on the device. This step used to run `keytool -genkey` on
      # every release, which mints a brand new keypair each time — so every release
      # was signed by a different certificate and could only be installed by
      # uninstalling the previous build first, taking the cell baseline, the event
      # log and the trusted-device list with it.
      #
      # With the ANDROID_KEYSTORE_BASE64 secret set, every release is signed by the
      # same key and installs straight over the last one. Without it the run stops
      # here: a lost or mis-rotated secret must not publish a release that no
      # existing install can take and that looks tampered. The one exception is a
      # manual run with allow_throwaway_key, for trying the build itself: it signs
      # with a throwaway key, keeps the files as a workflow artifact and publishes
      # no GitHub release (the upload steps below require stable == 'true'). The
      # keystore is written under the runner's temp directory, outside the
      # checkout, and is gone when the job ends.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALLOW_THROWAWAY: ${{ inputs.allow_throwaway_key == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the persistent release key."
          elif [ "$ALLOW_THROWAWAY" != "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release signed with any other key cannot be installed over an earlier one, so nothing is built or published. Restore the secret (android/README.md, Signing), or start the workflow by hand with allow_throwaway_key to get a throwaway-signed build as a workflow artifact only."
            exit 1
          else
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::allow_throwaway_key: these builds are signed with a throwaway key. They are kept as a workflow artifact and not published as a release; the APKs cannot be installed over an earlier release, and the AAB must not be uploaded to Google Play."
          fi

      # Gradle signs the release builds itself from these four variables (see
      # signingConfigs in android/app/build.gradle.kts). The passwords come from
      # secrets and are never written to disk or to $GITHUB_ENV. The fallbacks
      # are the throwaway key's.
      - name: Build signed release APKs and the Play bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew assembleFullSuiteRelease assembleFullCommsRelease assembleFossSuiteRelease bundlePlaySuiteRelease \
            --no-daemon --stacktrace

      # The Play edition must not declare card emulation. This reads every
      # manifest Gradle merged for the Play bundle and stops the release if a
      # HostApduService or the card-emulation service ever finds its way back in.
      # The full edition's manifest is checked the other way round, so a change
      # in where Gradle writes manifests cannot make this pass by finding nothing.
      - name: Check the Play edition has no card emulation
        run: |
          HCE='HOST_APDU_SERVICE|host_apdu_service|CardEmulationService|BIND_NFC_SERVICE'
          PLAY=$(find android/app/build/intermediates -path '*playSuiteRelease*' -name AndroidManifest.xml | grep -E 'merged_manifest|bundle_manifest' || true)
          FULL=$(find android/app/build/intermediates -path '*fullSuiteRelease*' -name AndroidManifest.xml | grep -E 'merged_manifest' | head -1)
          if [ -z "$PLAY" ] || [ -z "$FULL" ]; then
            echo "::error::Merged manifests for playSuiteRelease / fullSuiteRelease not found"; exit 1
          fi
          if ! grep -Eq "$HCE" "$FULL"; then
            echo "::error::The full edition's manifest has no card-emulation service; the check below would prove nothing"; exit 1
          fi
          for m in $PLAY; do
            echo "Checking $m"
            if grep -Eq "$HCE" "$m"; then
              echo "::error file=$m::The Play edition declares card emulation"; exit 1
            fi
          done
          echo "No card emulation in the Play edition."

      # The comms-only build must not carry the toolkit's code, not merely leave it
      # unreachable. Drive mode (the RTL-SDR driver, radio scanner, ADS-B, OBD-II),
      # the NFC reader, the card vault and card emulation live in src/suite and
      # src/fullSuite behind TierShell (src/main/java/app/clairix/TierShell.kt), so
      # fullCommsRelease is compiled without them. R8 renames every class it keeps
      # (proguard-rules.pro keeps none of these and renames the source-file
      # attribute), so their names are never in the dex whether the code is there or
      # not, and grepping the dex would always pass. The mapping file R8 writes for
      # the variant lists every class it kept under its original name; this fails the
      # release if any of these classes, or a class nested in one, is listed. The
      # mapping must exist and list MainActivity, so a moved or empty mapping cannot
      # make the check pass by finding nothing.
      - name: Check the Comms edition carries no scanner, NFC or vault code
        run: |
          MAP=android/app/build/outputs/mapping/fullCommsRelease/mapping.txt
          if [ ! -s "$MAP" ]; then echo "::error::R8 mapping for the Comms APK not found at $MAP"; exit 1; fi
          if ! grep -q '^app\.clairix\.MainActivity -> ' "$MAP"; then
            echo "::error::$MAP does not list MainActivity; the check below would prove nothing"; exit 1
          fi
          found=0
          for cls in app.clairix.SdrUsbDriver app.clairix.ScannerMonitor app.clairix.AdsbDecoder \
                     app.clairix.ObdBluetoothManager app.clairix.DriveService \
                     app.clairix.analysis.NfcScanner app.clairix.analysis.CardVault \
                     app.clairix.CardEmulationService; do
            pattern="^${cls//./\\.}(\\\$[^ ]*)? -> "
            if grep -Eq "$pattern" "$MAP"; then
              echo "::error::The Comms APK carries $cls (listed in $MAP)"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "No SDR, radio scanner, ADS-B, OBD-II, NFC, card vault or card-emulation classes in the Comms APK."

      # The bills of materials the sbom job made from this commit.
      - name: Fetch the bills of materials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      - name: Collect and verify artifacts
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          OUT=android/app/build/outputs/release-files
          mkdir -p "$OUT"
          cp android/app/build/outputs/apk/fullSuite/release/app-full-suite-release.apk "$OUT/clairix-${TAG}.apk"
          cp android/app/build/outputs/apk/fullComms/release/app-full-comms-release.apk "$OUT/clairix-comms-${TAG}.apk"
          cp android/app/build/outputs/apk/fossSuite/release/app-foss-suite-release.apk "$OUT/clairix-foss-${TAG}.apk"
          cp android/app/build/outputs/bundle/playSuiteRelease/app-play-suite-release.aab "$OUT/clairix-play-${TAG}.aab"
          cp "$RUNNER_TEMP/sbom/clairix-android.cdx.json" "$OUT/sbom-android-${TAG}.cdx.json"
          cp "$RUNNER_TEMP/sbom/comms-crypto.cdx.json" "$OUT/sbom-comms-crypto-${TAG}.cdx.json"
          # The certificate digest is what decides whether a phone will accept an
          # APK as an update to the installed build, so print it: two releases that
          # share this value will install over each other, and two that do not
          # never will, whatever their version numbers say.
          for apk in "$OUT"/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done
          # The bundle is jar-signed; Play checks it against the upload key registered
          # at the first upload, which is to be this same release key (android/README.md,
          # "Cutting a release" step 5a).
          keytool -printcert -jarfile "$OUT/clairix-play-${TAG}.aab"
          (cd "$OUT" && sha256sum "clairix-${TAG}.apk" "clairix-comms-${TAG}.apk" "clairix-foss-${TAG}.apk" "clairix-play-${TAG}.aab" \
            "sbom-android-${TAG}.cdx.json" "sbom-comms-crypto-${TAG}.cdx.json" > SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"

      # Android 15+ devices with 16 KB pages load only libraries built for them, and
      # Google Play requires it: every LOAD segment of each 64-bit library must be
      # 0x4000-aligned, and the APKs must place the libraries on 16 KiB boundaries
      # (zipalign -c -P 16 -v 4; the bundle's libraries are read the same way, and
      # bundletool does its own aligning). Today that holds because cargo-ndk 4.1.2
      # passes max-page-size for NDK 27; this step stops a release the day it stops.
      - name: Check the native libraries are built for 16 KB pages
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          OUT=android/app/build/outputs/release-files
          tools/android/check-16k-alignment.sh "$OUT/clairix-${TAG}.apk" "$OUT/clairix-comms-${TAG}.apk" "$OUT/clairix-foss-${TAG}.apk" "$OUT/clairix-play-${TAG}.aab"

      # At the first Play upload this release key is enrolled in Play App Signing
      # ("Use an existing key", android/README.md "Cutting a release" step 5a), so
      # the APKs Play delivers carry the same certificate as the APKs here and the
      # editions install over each other. That holds only while the bundle is
      # signed by the key that signs the APKs; this step fails the release when they
      # differ, and the digest it prints is the one a Play-delivered APK must show
      # (step 5a's verification).
      - name: Check the bundle and the APKs share one signing certificate
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          OUT=android/app/build/outputs/release-files
          tools/android/check-bundle-signer.sh "$OUT/clairix-play-${TAG}.aab" "$OUT/clairix-${TAG}.apk" "$OUT/clairix-comms-${TAG}.apk" "$OUT/clairix-foss-${TAG}.apk"

      # The checksum file is signed with the asset signing key (tools/signing),
      # whose public half is committed as android/asset-signing.pem, so a
      # swapped release cannot come with matching checksums. The app's own
      # map and work-zone downloads are checked against the same key.
      - name: Sign the checksums
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          OUT=android/app/build/outputs/release-files
          python tools/signing/sign.py "$OUT/SHA256SUMS.txt"
          python tools/signing/sign.py --verify android/asset-signing.pub "$OUT/SHA256SUMS.txt"

      - name: Compose release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
          STABLE: ${{ steps.signing.outputs.stable }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          # "3.0.0-beta.1" reads as "3.0.0 Beta 1" on the release page.
          PRETTY=$(printf '%s' "$VERSION" | sed -E 's/-beta\.?([0-9]+)$/ Beta \1/; s/-alpha\.?([0-9]+)$/ Alpha \1/; s/-rc\.?([0-9]+)$/ Release Candidate \1/')
          OUT=android/app/build/outputs/release-files
          {
            echo "## Clairix ${PRETTY}"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "This is a **beta**: a public test of Clairix 3.0. It is meant for people"
              echo "who are happy to try new things and tell us what breaks. Keep your current"
              echo "version if you rely on Clairix every day and don't want surprises."
              echo
            fi
            echo "### What's new in Beta 9: a stalkerware check that weighs more, and a safer way to act on it"
            echo
            echo "- **The stalkerware scan weighs more of what an app can do.** It tells permissions"
            echo "  Android granted from ones an app only asked for, counts a battery-optimisation"
            echo "  exemption beside the signs a monitoring app shows (never on its own), and reads"
            echo "  who holds your default SMS app, phone app and home screen; Phone check has a row"
            echo "  for those three. It runs every day and after installs, matches apps against a"
            echo "  published list of known stalkerware (Echap's Stalkerware Indicators), says when a"
            echo "  device or work-profile owner manages the phone, and no longer flags an app for"
            echo "  where it was installed from alone. Signal installed from signal.org is recognised"
            echo "  by Signal's signing key instead of being called an impostor."
            echo "- **A safety step before removing a flagged app.** Removing or switching off an app"
            echo "  can alert whoever installed it. Before its settings open, Clairix now says so,"
            echo "  offers to save evidence first and to contact a helpline, and asks you to"
            echo "  continue. Findings about trackers and stalkerware lead with the same advice."
            echo "- **Watching the hours you sleep.** A Bluetooth device newly paired, or an app"
            echo "  installed soon after an unlock while you were asleep, is reported, its alert held"
            echo "  until you next unlock the phone."
            echo "- **Shielded from other apps.** On Android 14 and newer, only accessibility tools"
            echo "  such as TalkBack can read Clairix's screens; on Android 12 and newer, other apps'"
            echo "  overlays are hidden while Clairix is open. (Clairix Comms is unchanged.)"
            echo "- **Evidence you can hand over.** The evidence report exports as text or JSON, is"
            echo "  dated and signed by a key kept in the phone's Keystore, and covers apps with"
            echo "  spy-level access, phone integrity, unlocks while you slept and the camera sweep."
            echo "  It now includes the battery exemption and what each app asked for but was not"
            echo "  granted."
            echo "- **Clean link.** Share a link to Clairix, or select it and choose Clean link, and"
            echo "  it removes tracking parameters and unwraps redirect links, on the phone, with no"
            echo "  network request. (Not in Clairix Comms.)"
            echo "- **Second opinions on the phone itself.** The scan now counts an app that hides its"
            echo "  icon or came from outside a store and keeps sending data every day (never on its own),"
            echo "  and shows each app's traffic. Phone check asks the phone's secure hardware whether the"
            echo "  bootloader is locked (a second opinion, not proof: Google's roots are not checked)."
            echo "  Share a bug report to Clairix to see which apps used the microphone, camera and"
            echo "  location, read on the phone. The timeline is hash-chained, so a changed or removed"
            echo "  entry shows in the evidence report. (Not in Clairix Comms.)"
            echo "- **Comms:** block someone, keep first messages from strangers as message requests,"
            echo "  and report a number to its relay (never what was written). Save a recovery file,"
            echo "  protected by a recovery code, to get your number and contacts back on a new phone"
            echo "  if yours is lost."
            echo "- **Discreet mode.** Neutral notifications and lock screen, a disguised launcher"
            echo "  entry (Compass or Notes) and a quick exit; plus a checklist of who else can see"
            echo "  this phone (accounts, location sharing, Find My Device and more)."
            echo "- **Lock and wipe.** Setup offers a passcode; wrong codes slow a guesser down and"
            echo "  wipe only if you chose that. The duress passcode now leaves a decoy instead of a"
            echo "  blank, freshly wiped app."
            echo "- **SOS:** an optional text message to one number and an emergency-call button, and"
            echo "  SOS alerts and group messages that could not be delivered are retried for each"
            echo "  member."
            echo "- **Battery:** a low-power mode (automatic below 20 %), a Battery page in Settings,"
            echo "  and Comms no longer pings the relay every 45 seconds."
            echo "- **Positions without Google.** On a phone without Google Play services, positions"
            echo "  come from Android's own location service, a Satellite-only switch keeps them to"
            echo "  GPS alone, and mock locations are never trusted."
            echo "- **A build without Google Play services.** \`clairix-foss-${TAG}.apk\` is the Full"
            echo "  edition built without Google's location library or Firebase: the build meant for"
            echo "  F-Droid, published here so F-Droid can check its own build against it."
            echo "- **Fixes:** a message is no longer sent twice when the phone locks between the"
            echo "  relay accepting it and the app marking it sent; a send whose answer from the relay"
            echo "  was lost is retried with the same encrypted envelope instead of being encrypted"
            echo "  again. The Comms APK no longer carries the scanner, NFC or card-vault code at all."
            echo "- **Relay operators:** run this release's relay. It adds message reports, account"
            echo "  suspension and the adaptive heartbeat this version asks for."
            echo "- The COMMS database is upgraded once, on first start (version 13)."
            echo
            echo "### What was new in Beta 8: harder to flood, safer invites, a release you can check"
            echo
            echo "- **Nobody can fill your mailbox against your contacts.** Your phone gives each"
            echo "  contact a pass, inside your encrypted messages, and gives your relay the key it"
            echo "  is checked with. Messages from people you have never written to share a small"
            echo "  part of your mailbox (300 at a time, 300 an hour), so a stranger with any number"
            echo "  of accounts can no longer fill it and have it refuse everyone. Deleting a"
            echo "  contact replaces the pass, so someone flooding you is a stranger from then on."
            echo "  The relay learns whether a message came from someone you wrote to, never who."
            echo "- **Invite links only Clairix can open.** Invites are now https://clairix.app/i links."
            echo "  Android checks that the site names Clairix and its signing key, so the link opens"
            echo "  in Clairix and no other app can take it. Without Clairix it opens a page on"
            echo "  clairix.app, never one the inviter's relay serves. Links from earlier versions"
            echo "  still work."
            echo "- **You see which relay an invite puts you on.** Before you register, setup names"
            echo "  the relay and says whether it is on the signed relay list. For one that is not,"
            echo "  it says what that relay's operator would see, and Register waits until you"
            echo "  confirm you know who runs it."
            echo "- **This release is checked against its source.** Beta 7 was rebuilt from its tag"
            echo "  on another machine and matched both published APKs file for file. From now on"
            echo "  every release is rebuilt and compared the same way as soon as it is published."
            echo "- **Licence:** Clairix is now free software under the GNU GPL version 3, and the"
            echo "  repository has a security policy and an audit pack for independent reviewers."
            echo "- **Relay operators:** run this release's relay; it checks contacts' passes. Your"
            echo "  contacts need Beta 8 for their messages to count as from a contact."
            echo "- The COMMS database is upgraded once, on first start (version 11)."
            echo
            echo "### What was new in Beta 7: your relay, your way out, and a phone that keeps quiet when locked"
            echo
            echo "- **Move to another relay.** If your relay is blocked where you are, shut down, or no"
            echo "  longer one you trust, Comms settings → Move to another relay takes you to another"
            echo "  one (from the relay list, an address and secret, or an invite). You keep your keys,"
            echo "  contacts, conversations and verified contacts and get a new number there; every"
            echo "  contact is sent it over the encrypted session you already share, and their phones"
            echo "  switch over by themselves. What they send to your old number before then is"
            echo "  collected from the old relay whenever it can be reached, for 30 days. Moving back"
            echo "  gives you your old number again. Your contacts need Beta 7 to follow a move."
            echo "- **Connect through Tor.** One switch in Comms settings sends everything Clairix says"
            echo "  to relays through Tor, built into the app: no relay learns your network address,"
            echo "  and your network does not learn which relay you use. A relay with an onion"
            echo "  address is reached there, so the connection never leaves Tor. Calls do not go"
            echo "  through Tor."
            echo "- **Run your own relay.** One script sets up a relay on a server of your own, behind"
            echo "  HTTPS and its own onion address, with updates and restarts looked after. Setup in"
            echo "  the app now offers a signed list of relays, and checks a listed relay still has"
            echo "  the key the list gives it before registering."
            echo "- **A locked phone gives nothing away.** What reads your conversations now needs the"
            echo "  phone unlocked. While it is locked, messages are collected but stay sealed until"
            echo "  you unlock; a call rings as \"Clairix call\", naming no one, and Answer unlocks"
            echo "  and answers. Lock-screen notifications name no one and show no text or position."
            echo "- **Forward secrecy for who sent what.** Envelopes are sealed to a key each phone"
            echo "  replaces every week, so someone who logs a relay's traffic and takes your phone"
            echo "  weeks later cannot work out who sent you each one. The sender's claim inside is now"
            echo "  deniable, and short messages are padded so a first message and a reply look alike."
            echo "- **Security fixes from a second full review**, among them:"
            echo "  - a crafted invite or link could have replaced a verified contact's keys;"
            echo "  - the relay could have tagged blind tokens;"
            echo "  - the app lock did not stop accessibility services reading what was behind it;"
            echo "  - the duress wipe waited on the network before deleting anything."
            echo "  The full list is in docs/SECURITY-FINDINGS.md."
            echo "- **Fixes found by long tests on Android 12 to 15:** messages that could stay queued,"
            echo "  a locked screen at the wrong moment leaving messages unopenable until a restart,"
            echo "  photos to contacts on other relays stalling, and a call that rang \"Unlock to"
            echo "  answer\" again after you had unlocked."
            echo "- **Relay operators:** run this release's relay. Beta 7 phones keep their weekly"
            echo "  sealing keys and their locked-phone collection key there."
            echo "- The COMMS database is upgraded once, on first start (version 10)."
            echo
            echo "### What was new in Beta 6: blind tokens, disappearing messages"
            echo
            echo "- **Blind send tokens.** Every message spends a single-use token, and the relay"
            echo "  could once have matched a token to the account it handed it to. Tokens are now"
            echo "  blind (RFC 9497, the construction Privacy Pass uses): your phone makes each one"
            echo "  and the relay signs it without seeing it, proving it used the key it shows"
            echo "  everyone. Even a relay that recorded every request cannot tell from the token"
            echo "  whose a message was (it still sees the network address; use Tor or a VPN)."
            echo "- **Disappearing messages.** Tap Disappearing in any chat or group and pick 5"
            echo "  minutes to 4 weeks. Each message is deleted that long after it is read (yours,"
            echo "  after they are sent), photos and voice notes with it, on both phones; every"
            echo "  message carries the timer, so a phone that missed the change still deletes it."
            echo "  Deleted messages are overwritten in the database, not just unlinked."
            echo "- **The offline mesh hides who a message is for.** A carried bundle is addressed"
            echo "  by a tag only its sender and recipient can work out; before, anyone with the"
            echo "  recipient's public key could recognise it."
            echo "- **No more learning that a number exists through other relays.** Several relays"
            echo "  acting together could fill a mailbox and read the refusal; now they are answered"
            echo "  exactly as for a number that does not exist."
            echo "- **Tested end to end on Android.** Every change now runs the app on an emulator"
            echo "  against two real relays: texts, receipts, voice notes, photos, groups,"
            echo "  disappearing messages, a ringing call and a contact on another relay."
            echo "- **Rebuildable releases.** The NDK and cargo-ndk are pinned, so anyone can rebuild"
            echo "  this APK with the same tools and compare it."
            echo "- The COMMS database is upgraded once, on first start (version 8)."
            echo
            echo "### What was new in Beta 5: relays that reach each other, and checks on GPS, 2G and your keyboard"
            echo
            echo "- **Contacts on other relays.** Anyone can run a Clairix relay, and a contact on"
            echo "  another one is added by scanning their QR code. Your relay forwards to theirs,"
            echo "  signed with its own key: their relay sees your relay's address, never your"
            echo "  phone's, and nothing it receives names you. The contact's page says which relay"
            echo "  they are on. Both of you need Beta 5."
            echo "- **Mixing.** The relay holds each message a random few seconds (about four on"
            echo "  average, never more than twenty) and releases everything due together, shuffled,"
            echo "  so timing alone does not pair a message in with a delivery out. Calls being set"
            echo "  up, SOS alerts and group changes are never held."
            echo "- **Offline mesh** (off by default). Texts, group texts and SOS that cannot reach the"
            echo "  relay are passed phone to phone over Bluetooth in the same sealed envelopes,"
            echo "  addressed by a tag that changes daily, for at most two days and eight hops."
            echo "- **GPS spoofing and jamming checks.** Satellite signal strengths, satellite time"
            echo "  against network time, GPS against Wi-Fi and cell position, impossible jumps,"
            echo "  mock-location apps and the receiver's own gain control. Navigation warns over the"
            echo "  map when the signal is spoofed or jammed."
            echo "- **2G and VPN leaks** in Phone check: whether the phone has the \"Allow 2G\" switch"
            echo "  (and a red row if it is ever seen on a 2G tower), DNS or IPv6 leaking past the VPN,"
            echo "  Clairix left outside it, and \"Block connections without VPN\" turned off."
            echo "- **Ultrasonic beacons.** Listens on demand for the inaudible tones advertising kits"
            echo "  use to tie a phone to a place or a programme, after first checking the microphone"
            echo "  can hear that band. Nothing is recorded."
            echo "- **Your keyboard.** Clairix asks the keyboard not to learn from anything typed in"
            echo "  it, and Phone check names the keyboard in use and warns if it can reach the internet."
            echo "- **A tour of the app** after setup, covering every page with a button to open it;"
            echo "  take it again from Settings. Onboarding now explains why Android asks whether"
            echo "  Clairix may suggest Wi-Fi networks."
            echo "- **Security fixes from our own review:** a way to learn whether any number existed,"
            echo "  a way for another relay to fill someone's mailbox, and group messages that"
            echo "  recognised members by number alone. Members are now matched by their keys."
            echo "- The COMMS database is upgraded once, on first start, to record each contact's relay."
            echo
            echo "### What was new in Beta 4: what your Bluetooth gives away, and plate readers for real"
            echo
            echo "- **Bluetooth exposure** (Scan → Trackers). What a receiver by the road or in a"
            echo "  shop can log from this phone: its name, replaced with the model name in one tap"
            echo "  if it reads like yours; whether it is discoverable (and an alert if it stays"
            echo "  so); every paired accessory with whether its address is fixed for life or"
            echo "  rotates, which are connected now, and which rode along on your drives. The"
            echo "  phone's own advertising address rotates; a car's hands-free and most earbuds"
            echo "  do not, and the page says which of yours is the one being logged."
            echo "- **Surveillance hardware heard over radio.** A Flock Safety camera's battery"
            echo "  pack, a Raven gunshot detector or a Flock setup hotspot is recognised by the"
            echo "  signatures the DeFlock and flock-you projects published, compared with the"
            echo "  plate readers on your map (\"matches the reader mapped 80 m away\" or \"not on"
            echo "  the map yet\") and written to the timeline with your position. A certain match"
            echo "  notifies (Settings → Scanning). Flock has been turning these radios down since"
            echo "  2025, so hearing nothing next to a camera is normal; the map is the better guide."
            echo "- **The plate-reader lists are now published.** Beta 3 shipped the map layer, but"
            echo "  the daily map build had been failing since 22 October and no list ever went"
            echo "  out. Fixed; every region's release now carries its signed camera list, and the"
            echo "  app downloads it with the map."
            echo
            echo "### What was new in Beta 3: built for a seized phone and a watched network"
            echo
            echo "- **Everything at rest is sealed.** The location log, timeline, cell baseline,"
            echo "  trips, unlock ledger and comms log are encrypted under a key in the phone's"
            echo "  Keystore; the COMMS database runs under SQLCipher. Files from earlier versions"
            echo "  are converted once, on first start."
            echo "- **History is kept 30 days by default** (7, 90 or forever in Settings → Data):"
            echo "  what was deleted cannot be taken from the phone."
            echo "- **App lock that means it.** Wrong passcodes wipe (3 by default), a duress"
            echo "  passcode wipes silently, \"Wipe Clairix\" wipes on demand, and a locked app"
            echo "  shows \"Unlock to read\" in place of every notification."
            echo "- **The relay keeps less.** No activity times, no last-seen, sends spent through"
            echo "  anonymous tokens, allowances kept only to the hour; an optional TLS pin on the"
            echo "  relay's key; optional cover traffic and relay-only calls; alternate relay"
            echo "  addresses with failover."
            echo "- **Navigation searches on the phone.** Destinations are found in the downloaded"
            echo "  map's road names; the online search is a separate, labelled choice."
            echo "- **Signed releases.** \`SHA256SUMS.txt.sig\` is the checksum list signed with"
            echo "  the project key, maps and work zones are signed the same way, and every"
            echo "  change is built twice on two machines in CI and must come out the same."
            echo "- **Smaller download.** Native libraries are stripped; earlier builds shipped"
            echo "  them with debug information."
            echo "- **Known plate readers.** Flock Safety and other licence-plate cameras mapped"
            echo "  in OpenStreetMap are shown on the map, spoken 600 m before you reach one,"
            echo "  counted on every route and routed around by default (Drive → route options)."
            echo "  Only what has been mapped: an unmapped camera is not avoided."
            echo
            echo "### What was new in Beta 2: stronger COMMS"
            echo
            echo "- **The relay no longer learns who is writing to whom.** Messages are delivered"
            echo "  with single-use anonymous tokens instead of your number, and the sender's"
            echo "  identity travels signed inside the encrypted message."
            echo "- **Message lengths are hidden.** Every message is padded up to one of a few"
            echo "  set sizes before it is encrypted, so short messages all look the same."
            echo "- **Key changes are held for you.** If a contact's security key changes, their"
            echo "  messages wait in a review box until you verify, accept or discard them."
            echo "- **Screenshots and screen recording are blocked** on COMMS screens."
            echo "- **Secret keys are wiped from memory** by the encryption library as soon as"
            echo "  they are no longer needed."
            echo
            echo "### What's new in 3.0"
            echo
            echo "- **A new look.** Every screen has been redesigned: clearer status at the top of"
            echo "  each tab, bigger touch targets, and a choice of dark colour themes in"
            echo "  Settings → Appearance."
            echo "- **Two editions.** Clairix is built as the Full edition (this download) and a"
            echo "  Google Play edition, which is in preparation; https://clairix.app/download says"
            echo "  whether it is out. They are the same app, except that the Play edition leaves"
            echo "  out the Card Vault with card emulation and ClairixCoin."
            echo "- **Fixes** across the app, including the colour theme when an incoming call"
            echo "  starts Clairix and clearer wording on the certificate-pinning check."
            echo
            echo "### Which file do I want?"
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`clairix-${TAG}.apk\` | **The Full edition.** The whole app, including the Card Vault and ClairixCoin. Most people want this one. |"
            echo "| \`clairix-comms-${TAG}.apk\` | **Clairix Comms.** Only the encrypted messages, calls, groups and SOS: the scanner and tools are not reachable and none of their permissions are requested, and the Drive radio scanner, NFC reader, card vault and card emulation are not in the file at all. For people you want to be able to reach but not hand the full toolkit. Installing the Full edition over it later keeps the number, contacts and messages. |"
            echo "| \`clairix-foss-${TAG}.apk\` | **The foss edition.** The Full edition built without Google Play services or Firebase: positions come from Android's own location service. It is the build F-Droid is to publish, here so F-Droid can check that its build from the source matches, and it is signed with the same key as the Full edition, so either installs over the other. Clairix is not on F-Droid yet, and this edition's update notice points there; most people want \`clairix-${TAG}.apk\`. |"
            echo "| \`clairix-play-${TAG}.aab\` | The bundle for the Play Console, signed with the same key as the APKs. Phones can't install this file directly. |"
            echo "| \`sbom-android-${TAG}.cdx.json\` | Bill of materials (CycloneDX): every Java and Kotlin library in the four files above, with its version. |"
            echo "| \`sbom-comms-crypto-${TAG}.cdx.json\` | Bill of materials (CycloneDX): every Rust crate in the encryption library the four files carry, with its version. |"
            echo "| \`SHA256SUMS.txt\` | Checksums to confirm your download is intact. |"
            echo "| \`SHA256SUMS.txt.sig\` | Signature over the checksums by the Clairix asset signing key, so a swapped release cannot come with matching checksums. |"
            echo
            echo "### What Clairix does"
            echo
            echo "Clairix is a defensive security monitor for Android. It finds Bluetooth tracker"
            echo "tags that travel with you, Wi-Fi bait networks and signs of fake cell towers, and"
            echo "checks NFC cards and tags for skimmers. Detection data stays on your phone. The"
            echo "Map tab downloads OpenStreetMap tiles, which shows the tile server your IP address"
            echo "and the area you are looking at."
            echo
            echo "**COMMS** is end-to-end encrypted messaging and calling between Clairix apps. Your"
            echo "relay passes messages along but can read neither what they say nor who sent them."
            echo "A Clairix number is not a phone number: it only reaches other Clairix apps on the"
            echo "same relay. You (or someone you trust) set up the relay in \`comms-worker/\` once;"
            echo "everyone else joins by invite from COMMS → INVITE."
            echo
            echo "### Install"
            echo
            if [ "$STABLE" = "true" ]; then
              echo "1. Download \`clairix-${TAG}.apk\` below and tap it."
              echo "2. It installs straight over an earlier Clairix release and keeps your baseline, event log and trusted devices."
              echo "3. First install only: Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            else
              echo "> [!WARNING]"
              echo "> This build is signed with a throwaway key (a manual run with allow_throwaway_key),"
              echo "> so it was kept as a workflow artifact and not published as a release. Android will"
              echo "> refuse to install it over an earlier release: you have to uninstall the old version"
              echo "> first, which clears the cell baseline, the event log and the trusted-device list."
              echo
              echo "1. Uninstall any existing Clairix."
              echo "2. Download \`clairix-${TAG}.apk\` below and tap it."
              echo "3. Settings → Apps → Special app access → Install unknown apps → allow your file manager."
              echo "4. Grant Nearby devices and Location (precise). Notifications is optional — declining it costs the alert, not the detector."
            fi
            echo
            echo "**Requirements:** Android 12 or newer."
            echo
            echo "### Check your download"
            echo
            echo "On a computer, put what you downloaded in one folder with \`SHA256SUMS.txt\` and run"
            echo "\`sha256sum -c --ignore-missing SHA256SUMS.txt\` (on a Mac:"
            echo "\`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\`). Each file should say OK."
            echo
            echo "To check that the checksums themselves came from the Clairix release key, fetch"
            echo "[\`android/asset-signing.pem\`](https://github.com/jakes1345/Clairix/blob/main/android/asset-signing.pem)"
            echo "from the repository and run (the signature is base64 without its trailing"
            echo "padding, which the first line puts back):"
            echo
            echo '```'
            echo "sed 's/\$/==/' SHA256SUMS.txt.sig | base64 -d > sums.sig"
            echo "openssl pkeyutl -verify -pubin -inkey asset-signing.pem -rawin -in SHA256SUMS.txt -sigfile sums.sig"
            echo '```'
            echo
            echo '```'
            cat "$OUT/SHA256SUMS.txt"
            echo '```'
            if [ "$PRERELEASE" = "true" ]; then
              echo
              echo "### Found a problem?"
              echo
              echo "Open an issue on GitHub and say which file you installed, your phone model and"
              echo "Android version, and what you did just before it went wrong."
            fi
          } > "$RUNNER_TEMP/notes.md"

      # Only files signed with the release key are attached to a release: a
      # throwaway-signed build (allow_throwaway_key) is kept as an artifact of this
      # run instead, with the notes that say what it is.
      - name: Create GitHub Release
        if: steps.signing.outputs.stable == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Clairix ${{ steps.tag.outputs.name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            android/app/build/outputs/release-files/clairix-${{ steps.tag.outputs.name }}.apk
            android/app/build/outputs/release-files/clairix-comms-${{ steps.tag.outputs.name }}.apk
            android/app/build/outputs/release-files/clairix-foss-${{ steps.tag.outputs.name }}.apk
            android/app/build/outputs/release-files/clairix-play-${{ steps.tag.outputs.name }}.aab
            android/app/build/outputs/release-files/sbom-android-${{ steps.tag.outputs.name }}.cdx.json
            android/app/build/outputs/release-files/sbom-comms-crypto-${{ steps.tag.outputs.name }}.cdx.json
            android/app/build/outputs/release-files/SHA256SUMS.txt
            android/app/build/outputs/release-files/SHA256SUMS.txt.sig
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

      - name: Keep the throwaway-signed build as a workflow artifact
        if: steps.signing.outputs.stable != 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          cp "$RUNNER_TEMP/notes.md" android/app/build/outputs/release-files/NOTES.md
          echo "::notice::Signed with a throwaway key, so no GitHub release was published; the files are in this run's throwaway-signed-${TAG} artifact."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.signing.outputs.stable != 'true'
        with:
          name: throwaway-signed-${{ steps.tag.outputs.name }}
          path: android/app/build/outputs/release-files/
          if-no-files-found: error
          retention-days: 7

  # A release published with this workflow's own token starts no other
  # workflow, so the rebuild-and-compare check is called from here: a runner
  # that never saw this build makes it again from the tag and requires the
  # published APKs to match (verify-release.yml). A throwaway-signed build
  # published nothing, so there is nothing to verify.
  verify:
    needs: release
    if: needs.release.outputs.stable == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # A failed release, or one whose rebuild did not match, is seen on the Actions
  # tab by whoever started it; this opens an issue as well, or adds the run to
  # the open one (.github/scripts/report-failure.sh), so it is not lost.
  alert:
    needs: [checks, emulator, sbom, release, verify]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_TITLE: Release workflow failing
          FAILURE_MEANS: >-
            The release for the tag named in the run was not published: its checks (the Android APK
            workflow, a passing emulator run on the same tree, the bills of materials) or the release
            job failed; or its rebuild-and-compare check (verify-release.yml) did not match the
            published APKs.
        run: .github/scripts/report-failure.sh
