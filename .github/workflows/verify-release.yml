name: Verify a release

# Rebuilds a published release from its tag, on a machine that never saw the
# release being made, and requires the APKs on the release page to match the
# rebuild, entry by entry, signature files aside (tools/reproducible). A
# release that does not match was not built from the source it names. The
# foss APK (clairix-foss-<tag>.apk) is rebuilt and compared when the release
# carries one; releases before 3.0.0 Beta 9 do not.
#
# Runs after release.yml publishes a release, when a release is published by
# hand, by hand for any tag, and on changes to this workflow or the comparison
# tools, when it checks the newest release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v3.0.0-beta.7)'
        required: true
  # Called by release.yml once it has published: a release made with a
  # workflow's own token does not start this workflow by itself.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to verify'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/verify-release.yml'
      - 'tools/reproducible/**'

# Read-only: it downloads the release and builds; it changes nothing.
# Every action is pinned to a commit, as in android.yml.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Choose the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            # A pull request: the newest app release, prereleases included. Data
            # releases (ioc, relays, maps, work zones) are published under tags that
            # are not versions and are skipped: "ioc" was the newest on 2 November.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$"))][0] // ""')
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a release tag: $TAG"; exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Verifying $TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          path: source

      # The comparison tools as they are on this run's own commit, so a change
      # to them is tested against a real release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools-checkout
          sparse-checkout: tools/reproducible

      - name: Download the published release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir published
          patterns=(--pattern "clairix-$TAG.apk" --pattern "clairix-comms-$TAG.apk" --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sig)
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qxF "clairix-foss-$TAG.apk" <<< "$assets"; then
            patterns+=(--pattern "clairix-foss-$TAG.apk")
            echo "foss=true" >> "$GITHUB_OUTPUT"
          else
            echo "No clairix-foss-$TAG.apk on this release; only the full edition and Comms are compared."
            echo "foss=false" >> "$GITHUB_OUTPUT"
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published "${patterns[@]}"
          cd published
          sha256sum -c --ignore-missing SHA256SUMS.txt

      # The checksums are signed with the project's asset key; the public half
      # is in the repository the tag points at.
      - name: Check the checksums' signature
        run: |
          sed 's/$/==/' published/SHA256SUMS.txt.sig | base64 -d > sums.sig
          openssl pkeyutl -verify -pubin -inkey source/android/asset-signing.pem -rawin \
            -in published/SHA256SUMS.txt -sigfile sums.sig

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install the pinned NDK, the API 36 platform and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No keystore in the environment, so Gradle writes the release APKs
      # unsigned; signing touches only what the comparison leaves out.
      - name: Rebuild the release APKs
        working-directory: source/android
        env:
          FOSS: ${{ steps.download.outputs.foss }}
        run: |
          TASKS="assembleFullSuiteRelease assembleFullCommsRelease"
          if [ "$FOSS" = true ]; then TASKS="$TASKS assembleFossSuiteRelease"; fi
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Compare the full edition
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tools-checkout/tools/reproducible/compare-apk.sh \
            source/android/app/build/outputs/apk/fullSuite/release/app-full-suite-release-unsigned.apk \
            "published/clairix-$TAG.apk"

      - name: Compare Clairix Comms
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tools-checkout/tools/reproducible/compare-apk.sh \
            source/android/app/build/outputs/apk/fullComms/release/app-full-comms-release-unsigned.apk \
            "published/clairix-comms-$TAG.apk"

      - name: Compare the foss edition
        if: steps.download.outputs.foss == 'true'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tools-checkout/tools/reproducible/compare-apk.sh \
            source/android/app/build/outputs/apk/fossSuite/release/app-foss-suite-release-unsigned.apk \
            "published/clairix-foss-$TAG.apk"
