name: Verify a release

# Rebuilds a published release from its tag, on a machine that never saw the
# release being made, and requires the APKs on the release page to match the
# rebuild, entry by entry, signature files aside (tools/reproducible). A
# release that does not match was not built from the source it names.
#
# Runs when a release is published, by hand for any tag, and on changes to
# this workflow or the comparison tools, when it checks the newest release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v3.0.0-beta.7)'
        required: true
  pull_request:
    paths:
      - '.github/workflows/verify-release.yml'
      - 'tools/reproducible/**'

# Read-only: it downloads the release and builds; it changes nothing.
# Every action is pinned to a commit, as in android.yml.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Choose the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            # A pull request: the newest release, prereleases included.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a release tag: $TAG"; exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Verifying $TAG"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          path: source

      # The comparison tools as they are on this run's own commit, so a change
      # to them is tested against a real release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tools-checkout
          sparse-checkout: tools/reproducible

      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "clairix-$TAG.apk" --pattern "clairix-comms-$TAG.apk" --pattern SHA256SUMS.txt --pattern SHA256SUMS.txt.sig
          cd published
          sha256sum -c --ignore-missing SHA256SUMS.txt

      # The checksums are signed with the project's asset key; the public half
      # is in the repository the tag points at.
      - name: Check the checksums' signature
        run: |
          sed 's/$/==/' published/SHA256SUMS.txt.sig | base64 -d > sums.sig
          openssl pkeyutl -verify -pubin -inkey source/android/asset-signing.pem -rawin \
            -in published/SHA256SUMS.txt -sigfile sums.sig

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install the pinned NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # No keystore in the environment, so Gradle writes the release APKs
      # unsigned; signing touches only what the comparison leaves out.
      - name: Rebuild the release APKs
        working-directory: source/android
        run: ./gradlew assembleFullSuiteRelease assembleFullCommsRelease --no-daemon --stacktrace

      - name: Compare the full edition
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tools-checkout/tools/reproducible/compare-apk.sh \
            source/android/app/build/outputs/apk/fullSuite/release/app-full-suite-release-unsigned.apk \
            "published/clairix-$TAG.apk"

      - name: Compare Clairix Comms
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tools-checkout/tools/reproducible/compare-apk.sh \
            source/android/app/build/outputs/apk/fullComms/release/app-full-comms-release-unsigned.apk \
            "published/clairix-comms-$TAG.apk"
