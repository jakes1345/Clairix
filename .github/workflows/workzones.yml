name: Work zones

# Aggregates the public WZDx / CWZ work-zone feeds listed in the USDOT registry into one
# workzones-<slug>.json.gz per region (+ workzones-index.json) and publishes them on the single
# release tagged `workzones`, overwriting the previous run's files. The phone downloads
# https://github.com/jakes1345/Clairix/releases/download/workzones/workzones-<slug>.json.gz.
# Key-gated feeds are included when the WZDX_KEYS secret (JSON object: feedname -> key) has them.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Every action is pinned to a commit: this workflow publishes what every
# navigating phone downloads, and it holds the asset signing key.
permissions:
  contents: write

concurrency:
  group: workzones
  # A cancelled run could stop mid-upload and leave a mix of old and new release assets.
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pytest and the signing tool
        run: python -m pip install -r tools/signing/requirements.txt pytest==9.1.1

      - name: Test aggregator and signing tool
        run: python -m pytest -q tools/workzones/test_aggregate.py tools/signing/test_sign.py

      - name: Aggregate feeds
        env:
          WZDX_KEYS: ${{ secrets.WZDX_KEYS }}
        run: python tools/workzones/aggregate.py --out dist

      # Every per-region file is signed; the app verifies before it parses.
      - name: Sign
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          python tools/signing/sign.py dist/workzones-*.json.gz
          python tools/signing/sign.py --verify android/asset-signing.pub dist/workzones-*.json.gz

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: workzones
          name: Work zones
          body: |
            Live work zones aggregated from the USDOT WZDx feed registry, refreshed every 15 minutes.
            One workzones-<slug>.json.gz per region; workzones-index.json lists each feed's status.
            workzones-feeds.json.gz holds each feed's items so a feed that fails briefly is carried forward.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          # dist/workzones-*.json.gz includes workzones-feeds.json.gz.
          files: |
            dist/workzones-*.json.gz
            dist/workzones-*.json.gz.sig
            dist/workzones-index.json
