name: Work zones

# Aggregates the public WZDx / CWZ work-zone feeds listed in the USDOT registry into one
# workzones-<slug>.json.gz per region (+ workzones-index.json) and publishes them on the single
# release tagged `workzones`. Only the files whose content changed are replaced
# (tools/workzones/publish.py): the aggregator keeps a region's file byte-identical while its
# work zones are unchanged, so a run costs a few uploads rather than ~107 and stays under
# GitHub's secondary rate limit, which used to fail every run. The phone downloads
# https://github.com/jakes1345/Clairix/releases/download/workzones/workzones-<slug>.json.gz
# and reads the time of the last run from workzones-index.json.
# Key-gated feeds are included when the WZDX_KEYS secret (JSON object: feedname -> key) has them.
#
# The schedule is best-effort: GitHub runs scheduled workflows when it has capacity, in
# practice several times a day rather than every 15 minutes. That is why the app shows the
# data's age, and why a failing run opens an issue (the alert job) instead of failing unseen.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Every action is pinned to a commit: this workflow publishes what every
# navigating phone downloads, and it holds the asset signing key.
permissions:
  contents: write

concurrency:
  group: workzones
  # A cancelled run could stop mid-upload and leave a mix of old and new release assets.
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    # The first run after a format change replaces every file at one write a second, and a
    # rate limit can add a few minutes of waiting.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pytest and the signing tool
        run: python -m pip install -r tools/signing/requirements.txt pytest==9.1.1

      - name: Test aggregator, publisher, signing tool and failure alert
        run: python -m pytest -q tools/workzones tools/signing/test_sign.py .github/scripts/test_report_failure.py

      - name: Aggregate feeds
        env:
          WZDX_KEYS: ${{ secrets.WZDX_KEYS }}
        run: python tools/workzones/aggregate.py --out dist

      # Every per-region file is signed, and so is the index the app reads the run time
      # from; the app verifies before it parses.
      - name: Sign
        env:
          ASSET_SIGNING_KEY: ${{ secrets.ASSET_SIGNING_KEY }}
        run: |
          python tools/signing/sign.py dist/workzones-*.json.gz dist/workzones-index.json
          python tools/signing/sign.py --verify android/asset-signing.pub dist/workzones-*.json.gz dist/workzones-index.json

      # Replaces only the assets whose content changed, one write a second, with a retry
      # and backoff on 403/429; the release is created on the first run.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Live work zones aggregated from the USDOT WZDx feed registry.
          The workflow is scheduled every 15 minutes, but GitHub runs schedules on a best-effort basis, in practice several times a day: `generated` in workzones-index.json is the time of the last run, and the app shows it as the age of its work zones.
          One workzones-<slug>.json.gz per region, replaced only when its zones change (its `generated` is the run that last changed them); workzones-index.json lists each feed's status; workzones-feeds.json.gz holds each feed's items so a feed that fails briefly is carried forward; SHA256SUMS.txt lists every file's checksum.
          EOF
          # dist/workzones-*.json.gz includes workzones-feeds.json.gz.
          python tools/workzones/publish.py --tag workzones --name "Work zones" --prerelease \
            --body-file "$RUNNER_TEMP/notes.md" \
            dist/workzones-*.json.gz dist/workzones-*.json.gz.sig dist/workzones-index.json dist/workzones-index.json.sig

  # A red scheduled run is otherwise seen by nobody: this opens one issue, or adds the run
  # to the open one (.github/scripts/report-failure.sh).
  alert:
    needs: aggregate
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_TITLE: Work zones publish failing
          FAILURE_MEANS: >-
            No new work-zone files were published. Phones keep the files they last downloaded, and
            the age shown under route options ("Work zones as of ...") grows until a run succeeds.
        run: .github/scripts/report-failure.sh
