org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# The Kotlin compile daemon runs separately from Gradle; three variants compile in one build.
# 3 GB ran out on CI once the app passed 100k lines (run 41269300148); runners have 16 GB.
kotlin.daemon.jvmargs=-Xmx5g -XX:+UseParallelGC
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
