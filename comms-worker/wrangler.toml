# Clairix comms relay: store-and-forward for end-to-end encrypted envelopes
# between Clairix apps, addressed by Clairix number (not a phone number).
#
# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ENROLL_SECRET        One-time code typed into Clairix when it registers
#   TURN_KEY_ID          Optional, for calls: Cloudflare Realtime TURN key id
#   TURN_KEY_API_TOKEN   Optional, for calls: its API token
#   ADMIN_SECRET         Optional, for ClairixCoin: lets the operator mint coins (POST /v1/admin/coin/mint)
#   HERE_API_KEY         Optional, for navigation: HERE Traffic API v7 key; GET /v1/traffic/incidents
#                        reports HERE as "off" without it
#   TOMTOM_API_KEY       Optional, for navigation: TomTom Traffic API key; likewise "off" without it
#
# Plain variables (may go in [vars] below):
#   COIN_INITIAL_BALANCE ClairixCoin every new registration starts with, e.g. "100"; unset: none
#   WZDX_FEEDS           Optional, for navigation: comma-separated URLs of WZDx v4 GeoJSON
#                        feeds (state DOT work-zone feeds). The cron below fetches them every
#                        10 minutes and adds work zones as traffic incidents to every region
#                        whose area (learned from positioned reports) contains them. Phones
#                        already read every USDOT-registry feed from the `workzones` release
#                        (tools/workzones), so list only feeds missing from the registry; a
#                        zone in both is shown once.
#   HERE_DAILY_CAP       Upstream HERE incident calls allowed per UTC day, default "1000"
#   TOMTOM_DAILY_CAP     Upstream TomTom incident calls allowed per UTC day, default "2300"
#                        (at the cap the provider reports "quota" until UTC midnight)
#   INCIDENTS_PER_CALLER_DAILY_SHARE
#                        Share of each daily cap one phone may use, default "0.25"; past 80% of a
#                        cap only tiles with nothing cached are fetched

name = "clairix-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "TRAFFIC"
class_name = "Traffic"

[[durable_objects.bindings]]
name = "INCIDENTS"
class_name = "IncidentCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Traffic"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IncidentCache"]

[triggers]
crons = ["*/10 * * * *"]
