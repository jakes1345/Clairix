# Clairix comms relay: store-and-forward for end-to-end encrypted envelopes
# between Clairix apps, addressed by Clairix number (not a phone number).
#
# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ENROLL_SECRET        One-time code typed into Clairix when it registers
#   TURN_KEY_ID          Optional, for calls: Cloudflare Realtime TURN key id
#   TURN_KEY_API_TOKEN   Optional, for calls: its API token
#   ADMIN_SECRET         Optional: lets the operator delete an account on an emailed request
#                        (DELETE /v1/admin/accounts/:number, scripts/delete-account.mjs), read the
#                        abuse reports, suspend a number (with OPERATOR_KEYS below; docs/ABUSE.md) and,
#                        for ClairixCoin, mint coins (POST /v1/admin/coin/mint)
#   HERE_API_KEY         Optional, for navigation: HERE Traffic API v7 key; GET /v1/traffic/incidents
#                        reports HERE as "off" without it
#   TOMTOM_API_KEY       Optional, for navigation: TomTom Traffic API key; likewise "off" without it
#   RELAY_KEY            Optional: the Ed25519 seed (base64) this relay signs what it forwards to
#                        other relays with. Unset, the relay makes its own on first use and keeps
#                        it in its "relay-identity" object; set it (`npm run relay-key`) only to
#                        choose the key yourself. FEDERATION=off stops forwarding either way.
#   CODES_ADMIN_SECRET   Optional: lets the operator mint Supporter codes (POST /v1/admin/supporter/codes;
#                        docs/SUPPORTER.md). 16+ characters, chosen by the operator; unset, nobody can mint
#   GOOGLE_PLAY_SERVICE_ACCOUNT  Optional, with PLAY_VERIFY below: the JSON key file of the Google Cloud
#                        service account Play Console lets read the app's orders. The relay checks a Play
#                        purchase with Google before exchanging it for Supporter credentials
#
# Plain variables (may go in [vars] below):
#   COIN                 Optional: "off" switches ClairixCoin off (no balances shown, no payments,
#                        no starting balance, no minting); unset: on. Whether the project's own
#                        relay switches it off is set on the live Worker by its maintainer
#   COIN_INITIAL_BALANCE ClairixCoin every new registration starts with while the coin is on, e.g. "100";
#                        unset: none
#   OPERATOR_KEYS        Optional: comma-separated Ed25519 public keys of the operator identities
#                        (`node scripts/operator.mjs register` makes one and prints its key). Suspending
#                        a number (POST /v1/admin/suspend) needs a request signed by one of them as well
#                        as ADMIN_SECRET; unset, nobody can suspend
#   OPERATOR_CONTACT     Optional: where a suspended number can appeal (an email address), told to its phone
#   LEGACY_CUTOFF        Optional: the UTC day (YYYY-MM-DD) from which the old kind of token and envelopes
#                        in format 2, kept for apps before 3.0.0 Beta 7, are refused with 426 and a message
#                        to update Clairix; unset: 2027-01-01
#   RELAY_ALTERNATES     Optional: comma-separated https addresses this same relay also answers at
#                        (a second domain, its workers.dev name). Phones keep them and fall back
#                        to them when the address they registered at stops answering; a phone that
#                        has pinned the relay's key stays on the pinned address.
#   RELAY_ONION          Optional: the relay's onion address, http://<56 characters>.onion, for
#                        phones that connect through Tor (selfhost/install.sh sets it up)
#   DELIVERY_TOKENS_PER_HOUR  Optional: envelopes each account may send an hour (default 1000;
#                        a 5 MB video is 171), from 1 to 100000
#   PUSH_HOSTS           Optional: comma-separated push hosts (a self-hosted ntfy, say) trusted like
#                        ntfy.sh and up.conversations.im; an endpoint on any other host is used only
#                        after the phone echoes a one-time code pushed through it
#   PUSH_HOSTS_ONLY      Optional: "on" makes PUSH_HOSTS the only trusted push hosts, so ntfy.sh and
#                        up.conversations.im are checked like any other (README.md, Push wake-ups)
#   WZDX_FEEDS           Optional, for navigation: comma-separated URLs of WZDx v4 GeoJSON
#                        feeds (state DOT work-zone feeds). The cron below fetches them every
#                        10 minutes and adds work zones as traffic incidents to every region
#                        whose area (learned from positioned reports) contains them. Phones
#                        already read every USDOT-registry feed from the `workzones` release
#                        (tools/workzones), so list only feeds missing from the registry; a
#                        zone in both is shown once.
#   MIX_MAX_MS           Longest an envelope is held for mixing, in ms (default "20000"; the mean hold
#                        is a fifth of it). Held envelopes are released in shuffled batches so traffic
#                        in cannot be paired with deliveries out by timing alone. Only envelopes sent
#                        with "mix": true are held; the app leaves it off call set-up, SOS and group
#                        changes, and apps older than mixing never send it. "0" turns mixing off.
#   PLAY_VERIFY          Optional: "on" turns on POST /v1/supporter/play (Google Play purchases exchanged
#                        for Supporter credentials); needs PLAY_PACKAGE_NAME and GOOGLE_PLAY_SERVICE_ACCOUNT.
#                        Unset: off, and nothing is ever asked of Google
#   PLAY_PACKAGE_NAME    The Play edition's application id, "app.clairix"
#   PLAY_ALLOW_TEST_PURCHASES  Optional: "on" accepts Play licence testers' purchases too; off by default
#   FEDERATION           Which other relays may forward to this one: "open" (default; any relay,
#                        within per-relay limits), "off", or comma-separated https origins
#   RELAY_ORIGIN         The https address other relays should reach this one at, when requests
#                        arrive on a different one (a custom domain in front of workers.dev)
#   HERE_DAILY_CAP       Upstream HERE incident calls allowed per UTC day, default "1000"
#   TOMTOM_DAILY_CAP     Upstream TomTom incident calls allowed per UTC day, default "2300"
#                        (at the cap the provider reports "quota" until UTC midnight; past 80% of a
#                        cap only tiles with nothing cached are fetched). One phone's share is
#                        bounded by the traffic tokens its account is issued, 400 an hour.

name = "clairix-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Off: invocation logs keep request URLs (which name the looked-up number) and
# the caller's number header for days, outside the Worker's control.
[observability]
enabled = false

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "TRAFFIC"
class_name = "Traffic"

[[durable_objects.bindings]]
name = "INCIDENTS"
class_name = "IncidentCache"

# Branch previews (Cloudflare Workers Builds runs `wrangler preview` for every
# non-main branch). Each preview gets its own empty Durable Object storage, so it
# never touches the live relay's mailboxes. Previews inherit no secrets: set
# ENROLL_SECRET with `wrangler preview base-config secret put` to register on one.
[[previews.durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[previews.durable_objects.bindings]]
name = "TRAFFIC"
class_name = "Traffic"

[[previews.durable_objects.bindings]]
name = "INCIDENTS"
class_name = "IncidentCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Traffic"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IncidentCache"]

[triggers]
crons = ["*/10 * * * *"]
