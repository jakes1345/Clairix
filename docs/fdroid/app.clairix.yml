# DRAFT of metadata/app.clairix.yml for F-Droid's fdroiddata repository
# (https://gitlab.com/fdroid/fdroiddata). It has not been submitted, and it has not
# been run through `fdroid lint` or `fdroid build`: the open questions in
# docs/DISTRIBUTION.md ("F-Droid") come first. The maintainer submits it, as a merge
# request to fdroiddata, once they are settled.
#
# It builds the foss flavour's whole app (fossSuite): the full edition without Google
# Play services or Firebase. The comms-only build (fossComms) has the same package name
# and versionCode, so one F-Droid listing can carry only one of the two; the suite is the
# one listed.

Categories:
  - Security
  - Connectivity
License: GPL-3.0-only
WebSite: https://clairix.app
SourceCode: https://github.com/jakes1345/Clairix
IssueTracker: https://github.com/jakes1345/Clairix/issues
Changelog: https://github.com/jakes1345/Clairix/releases

AutoName: Clairix

RepoType: git
Repo: https://github.com/jakes1345/Clairix.git

# The listing text, icon and screenshots come from fastlane/metadata/android/en-US/
# in the repository, which F-Droid reads on its own.

Builds:
  # versionName and versionCode must be those of android/app/build.gradle.kts at the
  # tag built. 3.0.0-beta.8 (28) is the current version, but its tag predates the foss
  # flavour; no release tag carries it yet, so this entry has no `commit:` line and
  # cannot be built until one does. Add `commit: v<that version>` and set the two
  # fields (and CurrentVersion below) to match before submitting.
  - versionName: 3.0.0-beta.8
    versionCode: 28
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    gradle:
      - fossSuite
    # comms-crypto (Rust) is cross-compiled by the Gradle build through cargo-ndk, with
    # its Kotlin binding generated by uniffi-bindgen. The toolchain is the one
    # comms-crypto/rust-toolchain.toml pins (1.97.0, with the three Android targets);
    # the build refuses any cargo-ndk other than 4.1.2 and any NDK other than r27c.
    # Check the rustup srclib's version against fdroiddata's srclibs/rustup.yml.
    srclibs:
      - rustup@1.27.1
    prebuild:
      - bash $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain none
      - source $HOME/.cargo/env
      - cargo install cargo-ndk --version 4.1.2 --locked
    build:
      - source $HOME/.cargo/env
    ndk: r27c

AutoUpdateMode: None
UpdateCheckMode: Tags ^v[0-9.]+(-beta\.[0-9]+)?$
CurrentVersion: 3.0.0-beta.8
CurrentVersionCode: 28
