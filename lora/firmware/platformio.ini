; Clairix LoRa radio firmware.
;
;   pio run -d lora/firmware                     all three boards
;   pio run -d lora/firmware -e heltec_v3 -t upload
;
; The protocol itself is the library in ../core, built and tested on its own
; (cmake, see ../core/CMakeLists.txt); this project is the board glue around it.
; Every dependency is pinned to an exact version.

[platformio]
default_envs = heltec_v3, xiao_s3_wio, tdeck

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCLX_FIRMWARE_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    clairix-lora-core=symlink://../core
    jgromes/RadioLib@7.1.2
    h2zero/NimBLE-Arduino@1.4.3
build_src_filter = +<*.cpp> -<oled/> -<tdeck/>

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + 0.96" OLED): a radio for a phone.
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -DCLX_BOARD_HELTEC_V3
lib_deps =
    ${env.lib_deps}
    olikraus/U8g2@2.35.30
build_src_filter = ${env.build_src_filter} +<oled/>

; Seeed XIAO ESP32S3 + Wio-SX1262 kit: the smallest radio for a phone, no screen.
[env:xiao_s3_wio]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DCLX_BOARD_XIAO_S3_WIO

; LilyGO T-Deck / T-Deck Plus (ESP32-S3 + SX1262 + 2.8" screen + keyboard,
; GPS on the Plus): a handheld used on its own, and a radio for a phone too.
[env:tdeck]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DCLX_BOARD_TDECK
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.1.16
build_src_filter = ${env.build_src_filter} +<tdeck/>
